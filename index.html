async function reverseLookup(lat, lng) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&polygon_geojson=1&accept-language=he,en`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'he,en' } });
    const data = await res.json();
    const parts = (data.display_name || '').split(',').map(s => s.trim());
    const address = parts.slice(0, 3).join(', ') || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    const street = (data.address && (data.address.road || data.address.pedestrian || data.address.suburb)) || parts[0] || '';
    let polygon = null;
    if (data.geojson && (data.geojson.type === 'Polygon' || data.geojson.type === 'MultiPolygon')) {
      polygon = data.geojson.coordinates;
    }
    return { address, street, polygon };
  } catch (e) {
    return { address: `${lat.toFixed(5)}, ${lng.toFixed(5)}`, street: '', polygon: null };
  }
}

async function nominatim(query) {
  if (!query || query.length < 2) return [];
  try {
    const cleanQ = query.replace(/["']/g, ' ').replace(/\s+/g, ' ').trim();
    let url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cleanQ+' נתניה')}&format=json&limit=5&polygon_geojson=1&countrycodes=il&bounded=1&viewbox=34.82,32.31,34.88,32.25&accept-language=he,en`;
    let res = await fetch(url,{headers:{'Accept-Language':'he,en'}});
    let data = await res.json();
    
    if (!data || data.length === 0) {
      url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cleanQ+' נתניה')}&format=json&limit=5&polygon_geojson=1&countrycodes=il&accept-language=he,en`;
      res = await fetch(url,{headers:{'Accept-Language':'he,en'}});
      data = await res.json();
    }

    if ((!data || data.length === 0) && /\d+/.test(cleanQ)) {
      const streetOnly = cleanQ.replace(/\d+/g, '').replace(/[\,\-\.\u05f3\u05f4]/g, ' ').trim();
      url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(streetOnly+' נתניה')}&format=json&limit=5&polygon_geojson=1&countrycodes=il&accept-language=he,en`;
      res = await fetch(url,{headers:{'Accept-Language':'he,en'}});
      data = await res.json();
    }

    return data.map(x=>({
      display: x.display_name.split(',').slice(0,3).join(', '),
      lat: +x.lat,
      lng: +x.lon,
      polygon: (x.geojson && (x.geojson.type === 'Polygon' || x.geojson.type === 'MultiPolygon')) ? x.geojson.coordinates : null
    }));
  } catch { return []; }
}

async function fetchOSMBuildings() {
  try {
    const query = `[out:json][timeout:25];(way["building"](${OVERPASS_BBOX});relation["building"](${OVERPASS_BBOX}););out body;>;out skel qt;`;
    const res = await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST', body:'data='+encodeURIComponent(query),
      headers:{'Content-Type':'application/x-www-form-urlencoded'}
    });
    const json = await res.json();
    const nodes = {};
    json.elements.forEach(e => { if(e.type==='node') nodes[e.id]={lat:e.lat,lng:e.lon}; });
    const features = [];
    json.elements.forEach(e => {
      if(e.type==='way' && e.nodes) {
        const coords = e.nodes.map(nid => nodes[nid]).filter(Boolean);
        if(coords.length < 3) return;
        if(coords[0].lat !== coords[coords.length-1].lat) coords.push(coords[0]);
        const ring = coords.map(c=>[c.lng,c.lat]);
        const cLat = coords.reduce((s,c)=>s+c.lat,0)/coords.length;
        const cLng = coords.reduce((s,c)=>s+c.lng,0)/coords.length;
        features.push({
          type:'Feature',
          properties:{ osmId: e.id, centLat: cLat, centLng: cLng },
          geometry:{ type:'Polygon', coordinates:[ring] }
        });
      }
    });
    return features;
  } catch(e) {
    return [];
  }
}

const ConfigModal = ({ onClose, onSaved }) => {
  const current = getEnvConfig();
  const [url, setUrl] = useState(current.url || '');
  const [anonKey, setAnonKey] = useState(current.anonKey || '');
  const [adminPasscode, setAdminPasscode] = useState(current.adminPasscode || 'KavAdom1');
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);

  const testConnection = async () => {
    if (!url || !anonKey) {
      setTestResult({ ok: false, msg: 'Please provide both Supabase URL and Anon Key' });
      return;
    }
    setTesting(true);
    setTestResult(null);
    try {
      if (!window.supabase) throw new Error('Supabase library not loaded yet');
      const client = window.supabase.createClient(url.trim(), anonKey.trim());
      const { data, error } = await client.from('buildings').select('id').limit(1);
      if (error) throw error;
      setTestResult({ ok: true, msg: 'Connected successfully to Supabase buildings table!' });
    } catch(err) {
      setTestResult({ ok: false, msg: err.message || 'Connection failed' });
    } finally {
      setTesting(false);
    }
  };

  const handleSave = () => {
    const config = {
      url: url.trim(),
      anonKey: anonKey.trim(),
      adminPasscode: adminPasscode.trim() || 'KavAdom1'
    };
    try {
      localStorage.setItem(SUPABASE_KEY, JSON.stringify(config));
    } catch(e) {}
    supabaseClient = null;
    onSaved(config);
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
         onClick={e => e.target === e.currentTarget && onClose()} style={{pointerEvents:'all'}}>
      <div className="glass modal-panel w-full max-w-md rounded-2xl shadow-2xl overflow-hidden fade-in-up"

              <p className="text-sm font-bold text-white">Supabase Cloud Database</p>

  const handleAcInput = v => {
    setAcQuery(v); setAddress(v); setShowAc(true);
    clearTimeout(acTimer.current);
    if(v.length>=2){ setAcLoading(true); acTimer.current=setTimeout(async()=>{ setAcResults(await nominatim(v)); setAcLoading(false); },380); }
    else { setAcResults([]); setAcLoading(false); }

    setAddress(s.display); setAcQuery(s.display);
    setLat(s.lat.toFixed(6)); setLng(s.lng.toFixed(6));

    if (s.polygon) setBuildingPoly(s.polygon);
    const info = await reverseLookup(s.lat, s.lng);

    if (!s.polygon && info.polygon) setBuildingPoly(info.polygon);
  };

const SidebarList = ({buildings, filterStatus, searchQ, isAdmin, onBuildingClick, onClose}) => {
  const filtered = useMemo(()=>buildings.filter(b=>{
    const ms = !searchQ || b.address.toLowerCase().includes(searchQ.toLowerCase()) || b.street.toLowerCase().includes(searchQ.toLowerCase());
    const mf = !filterStatus || b.status===filterStatus;
    return ms && mf;
  }),[buildings,filterStatus,searchQ]);

  return (
    <div className="glass rounded-2xl overflow-hidden shadow-2xl" style={{maxHeight:'calc(100vh - 280px)',display:'flex',flexDirection:'column'}}>
      <div className="flex items-center justify-between px-4 py-3 border-b border-white/10">
        <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Buildings ({filtered.length})</span>
        <button onClick={onClose} className="p-1 rounded hover:bg-white/10 text-slate-500 hover:text-white t300" style={{pointerEvents:'all'}}>
          <Icon name="x" size={13}/>
        </button>
      </div>
      <div style={{overflowY:'auto',flex:1}}>
        {filtered.length===0 && <div className="p-5 text-center text-slate-500 text-xs">No buildings match.</div>}
        {filtered.map(b=>(
          <div key={b.id} onClick={()=>isAdmin&&onBuildingClick(b)}
            className={`px-4 py-3 border-b border-white/5 flex items-start justify-between gap-2 ${isAdmin?'cursor-pointer hover:bg-white/5':''} t300`}
            style={{pointerEvents:'all'}}>
            <div className="flex-1 min-w-0">
              <p className="text-xs font-semibold text-white truncate">{b.address}</p>
              <p className="text-[10px] text-slate-500">{b.neighborhood} · {b.units} units</p>
              {b.status==='paid' && <p className="text-[10px] text-emerald-400 mt-0.5">{fmt(b.paid)} paid</p>}
            </div>
            <Badge status={b.status}/>
          </div>
        ))}
      </div>
    </div>
  );
};

function App() {
  const [buildings,      setBuildings]      = useState(loadBuildings);
  const [isAdmin,        setIsAdmin]        = useState(false);
  const [showPwModal,    setShowPwModal]    = useState(false);
  const [showConfigModal,setShowConfigModal]= useState(false);
  const [selectedBldg,   setSelectedBldg]   = useState(null);
  const [addMode,        setAddMode]        = useState(false);
  const [addCoords,      setAddCoords]      = useState(null);
  const [showAddModal,   setShowAddModal]   = useState(false);
  const [searchQ,        setSearchQ]        = useState('');
  const [acResults,      setAcResults]      = useState([]);
  const [acLoading,      setAcLoading]      = useState(false);
  const [showAc,         setShowAc]         = useState(false);
  const [filterStatus,   setFilterStatus]   = useState('');
  const [showList,       setShowList]       = useState(false);
  const [toast,          setToast]          = useState(null);
  const [osmFeatures,    setOsmFeatures]    = useState([]);
  const [isFixingPos,    setIsFixingPos]    = useState(false);
  const [mapType,        setMapType]        = useState('street'); // STREET MAP AS DEFAULT

  const [dbLoading,      setDbLoading]      = useState(false);
  const [dbConnected,    setDbConnected]    = useState(false);
  const [isOffline,      setIsOffline]      = useState(!navigator.onLine);
  const [realtimeActive, setRealtimeActive] = useState(false);

  const mapRef       = useRef(null);
  const tileLayerRef = useRef(null);
  const markersRef   = useRef({});
  const osmLayerRef  = useRef(null);
  const tempMarkerRef = useRef(null);
  const toastTimer   = useRef(null);
  const acTimer      = useRef(null);

  const showToast = useCallback((msg,type='success')=>{
    setToast({msg,type});
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToast(null), 3200);
  },[]);

  const stats = useMemo(()=>{
    const total     = buildings.reduce((s,b)=>s+b.target,0);
    const committed = buildings.filter(b=>b.status==='committed').reduce((s,b)=>s+b.target,0);
    const paid      = buildings.filter(b=>b.status==='paid').reduce((s,b)=>s+b.paid,0);
    const pPaid     = total>0?(paid/total)*100:0;
    const pComm     = total>0?((paid+committed)/total)*100:0;
    return { total, committed, paid, pPaid, pComm,
      nPaid:       buildings.filter(b=>b.status==='paid').length,
      nCommitted:  buildings.filter(b=>b.status==='committed').length,
      nUncommitted:buildings.filter(b=>b.status==='uncommitted').length };
  },[buildings]);

  useEffect(() => {
    const handleOnline = () => setIsOffline(false);
    const handleOffline = () => setIsOffline(true);
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    return () => {
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
    };
  }, []);

  useEffect(() => {
    const client = getSupabaseClient();
    if (!client) {
      setDbConnected(false);
      setRealtimeActive(false);
      return;
    }

    let channel = null;
    let isMounted = true;

    async function initSupabase() {
      setDbLoading(true);
      try {
        const { data, error } = await client.from('buildings').select('*').order('id', { ascending: true });
        if (error) throw error;
        if (isMounted) {
          if (data && data.length > 0) {
            const mapped = data.map(mapDbToBuilding);
            setBuildings(mapped);
            saveBuildings(mapped);
          } else {
            const dbSeed = SEED.map(mapBuildingToDb);
            await client.from('buildings').upsert(dbSeed);
          }
          setDbConnected(true);
        }
      } catch (err) {
        if (isMounted) setDbConnected(false);
      } finally {
        if (isMounted) setDbLoading(false);
      }

      try {
        channel = client
          .channel('public:buildings')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'buildings' }, payload => {
            if (!isMounted) return;
            const eventType = payload.eventType;
            if (eventType === 'INSERT') {
              const newBuilding = mapDbToBuilding(payload.new);
              setBuildings(prev => {
                if (prev.some(b => b.id === newBuilding.id)) return prev;
                return [...prev, newBuilding];
              });
            } else if (eventType === 'UPDATE') {
              const updated = mapDbToBuilding(payload.new);
              setBuildings(prev => prev.map(b => b.id === updated.id ? updated : b));
              setSelectedBldg(prev => (prev && prev.id === updated.id ? updated : prev));
            } else if (eventType === 'DELETE') {
              const delId = payload.old.id;
              setBuildings(prev => prev.filter(b => b.id !== delId));
              setSelectedBldg(prev => (prev && prev.id === delId ? null : prev));
            }
          })
          .subscribe(status => {
            if (isMounted) {
              setRealtimeActive(status === 'SUBSCRIBED');
              if (status === 'SUBSCRIBED') setDbConnected(true);
            }
          });
      } catch (err) {}
    }

    initSupabase();

    return () => {
      isMounted = false;
      if (channel && client) client.removeChannel(channel);
    };
  }, []);

  useEffect(()=>{
    const map = L.map('map',{center:CENTER, zoom:ZOOM, minZoom:13, maxZoom:18, zoomControl:false, attributionControl:false});
    
    const tileUrl = mapType === 'satellite'
      ? 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
      : 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';

    const tLayer = L.tileLayer(tileUrl, {
      minZoom: 13, maxZoom: 18, maxNativeZoom: 18,
      attribution: mapType === 'satellite' ? '© Esri' : '© OpenStreetMap'
    }).addTo(map);

    tileLayerRef.current = tLayer;
    L.control.zoom({position:'bottomright'}).addTo(map);
    mapRef.current = map;
    return ()=>map.remove();
  },[]);

  useEffect(()=>{
    const map = mapRef.current;
    if(!map || !tileLayerRef.current) return;
    map.removeLayer(tileLayerRef.current);

    const tileUrl = mapType === 'satellite'
      ? 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
      : 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';

    const tLayer = L.tileLayer(tileUrl, {
      minZoom: 13, maxZoom: 18, maxNativeZoom: 18,
      attribution: mapType === 'satellite' ? '© Esri' : '© OpenStreetMap'
    }).addTo(map);
    tileLayerRef.current = tLayer;
  },[mapType]);

  useEffect(()=>{
    fetchOSMBuildings().then(features=>setOsmFeatures(features));
  },[]);

  useEffect(()=>{
    const map = mapRef.current;
    if(!map) return;
    if(osmLayerRef.current) { map.removeLayer(osmLayerRef.current); osmLayerRef.current=null; }

    const buildingFeatures = [];
    buildings.forEach(b => {
      let coords = b.polygon;
      if (!coords) {
        const dlat = 0.00016, dlng = 0.00024;
        coords = [[[b.lng - dlng, b.lat - dlat], [b.lng + dlng, b.lat - dlat], [b.lng + dlng, b.lat + dlat], [b.lng - dlng, b.lat + dlat], [b.lng - dlng, b.lat - dlat]]];
      }
      buildingFeatures.push({
        type: 'Feature',
        properties: { buildingId: b.id },
        geometry: { type: coords.length > 1 && Array.isArray(coords[0][0][0]) ? 'MultiPolygon' : 'Polygon', coordinates: coords }
      });
    });

    const layer = L.geoJSON({ type: 'FeatureCollection', features: buildingFeatures }, {
      style: feature => {
        const b = buildings.find(x => x.id === feature.properties.buildingId);
        if (!b) return { opacity: 0, fillOpacity: 0 };
        const s = STATUS[b.status];
        return { color: s.color, weight: b.status === 'uncommitted' ? 2 : 3, fillColor: s.fill, fillOpacity: s.fillOpacity + 0.1, opacity: 0.95 };
      },
      onEachFeature: (feature, leafletLayer) => {
        const b = buildings.find(x => x.id === feature.properties.buildingId);
        if (!b) return;
        const s = STATUS[b.status];
        const tip = `<div style="padding:4px"><strong style="color:#f1f5f9;font-size:12px;">${b.address}</strong><br/><span style="color:#94a3b8;font-size:10px;">📍 ${b.neighborhood}</span><div style="margin-top:4px;">Status: <span style="color:${s.color};font-weight:600">${s.label}</span></div>${b.status === 'paid' ? `<div>Paid: <span style="color:#34d399;font-weight:700">${fmt(b.paid)}</span> / ${fmt(b.target)}</div>` : `<div>Target: <span style="color:#fbbf24;font-weight:600">${fmt(b.target)}</span></div>`}</div>`;
        leafletLayer.bindTooltip(tip, { className: 'custom-tooltip', direction: 'top', sticky: true, opacity: 1 });
        leafletLayer.on('click', () => { if (isAdmin) setSelectedBldg(b); });
      }
    });
    layer.addTo(map);
    osmLayerRef.current = layer;
  },[buildings, isAdmin]);

  useEffect(()=>{
    const map = mapRef.current;
    if(!map) return;
    Object.values(markersRef.current).forEach(m=>map.removeLayer(m));
    markersRef.current = {};

    const vis = buildings.filter(b=>{
      const ms = !searchQ || b.address.toLowerCase().includes(searchQ.toLowerCase()) || b.street.toLowerCase().includes(searchQ.toLowerCase());
      const mf = !filterStatus || b.status===filterStatus;
      return ms && mf;
    });

    vis.forEach(b=>{
      const s = STATUS[b.status];
      const r = 14 + Math.min(b.units/12, 10);
      const sz = r*2+10;
      const ip = b.status==='paid', ic = b.status==='committed';
      const svg = `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg">${ip?`<circle cx="${sz/2}" cy="${sz/2}" r="${sz/2-1}" fill="${s.fill}" fill-opacity="0.1" stroke="${s.color}" stroke-width="1" stroke-dasharray="3 2"/>`:''}<circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="${s.fill}" fill-opacity="${ip?.55:ic?.32:.08}" stroke="${s.color}" stroke-width="${b.status==='uncommitted'?1.4:2.2}" stroke-opacity="${b.status==='uncommitted'?.5:.9}"/>${ip?`<path d="M${sz/2-4},${sz/2} l3,3 l5.5,-5.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:ic?`<circle cx="${sz/2}" cy="${sz/2}" r="4.5" fill="${s.color}" fill-opacity="0.85"/>`:`<circle cx="${sz/2}" cy="${sz/2}" r="3" fill="${s.color}" fill-opacity="0.5"/>`}</svg>`;

      const icon = L.divIcon({html:svg, className:'', iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], tooltipAnchor:[sz/2,-sz/2]});
      const m = L.marker([b.lat,b.lng],{icon,interactive:true});
      const tip = `<div style="padding:3px"><strong style="color:#f1f5f9;font-size:12px">${b.address}</strong><br/><span style="color:#94a3b8;font-size:10px">📍 ${b.neighborhood}</span><div style="margin-top:3px">Status: <span style="color:${s.color};font-weight:600">${s.label}</span></div></div>`;
      m.bindTooltip(tip,{className:'custom-tooltip',direction:'top',offset:[0,-sz/2],opacity:1});
      m.on('click',()=>{
        setBuildings(prev=>{
          const cur=prev.find(x=>x.id===b.id);
          if(cur) setSelectedBldg(cur);
          return prev;
        });
      });
      m.addTo(map);
      markersRef.current[b.id]=m;
    });
  },[buildings, searchQ, filterStatus]);

  useEffect(()=>{
    const map = mapRef.current;
    if(!map) return;
    const container = map.getContainer();

    const handleMapClick = async e => {
      if (!isAdmin || !addMode) return;
      const clickLat = e.latlng.lat, clickLng = e.latlng.lng;
      const distM = (lat1,lng1,lat2,lng2) => {
        const dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
        const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
        return 6371000*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
      };
      const existing = buildings.find(b => distM(b.lat, b.lng, clickLat, clickLng) < 25);
      if (existing) { if (isAdmin) setSelectedBldg(existing); return; }

      if (addMode) {
        if (tempMarkerRef.current){ map.removeLayer(tempMarkerRef.current); tempMarkerRef.current=null; }
        const pingIcon = L.divIcon({
          html:`<div style="position:relative;width:20px;height:20px"><div class="add-ping" style="position:absolute;inset:0;border-radius:50%;border:3px solid #10b981;"></div><div style="position:absolute;inset:4px;border-radius:50%;background:#10b981"></div></div>`,
          className:'', iconSize:[20,20], iconAnchor:[10,10]
        });
        tempMarkerRef.current = L.marker([clickLat, clickLng],{icon:pingIcon,interactive:false}).addTo(map);
        showToast('Looking up building data...', 'info');
        const info = await reverseLookup(clickLat, clickLng);
        setAddCoords({ lat: clickLat, lng: clickLng, address: info.address, street: info.street, polygon: info.polygon });
        setAddMode(false);
        setShowAddModal(true);
      }
    };

    if(addMode){
      container.classList.add('map-add-mode');
      map.on('click',handleMapClick);
    } else {
      container.classList.remove('map-add-mode');
      map.off('click',handleMapClick);
    }
    return ()=>{ map.off('click',handleMapClick); container.classList.remove('map-add-mode'); };
  },[addMode, isAdmin, buildings]);

  useEffect(()=>{
    if(!showAddModal && tempMarkerRef.current && mapRef.current){
      mapRef.current.removeLayer(tempMarkerRef.current);
      tempMarkerRef.current=null;
    }
  },[showAddModal]);

  useEffect(()=>{ saveBuildings(buildings); },[buildings]);

  const handleSave = useCallback(async updated => {
    setBuildings(prev => prev.map(b => b.id === updated.id ? updated : b));
    showToast(`${updated.address} — saved`);
    const client = getSupabaseClient();
    if (client && dbConnected) {
      try { await client.from('buildings').upsert(mapBuildingToDb(updated)); } catch(err) {}
    }
  }, [showToast, dbConnected]);

  const handleDelete = useCallback(async id => {
    setBuildings(prev => prev.filter(b => b.id !== id));
    showToast('Building deleted', 'info');
    const client = getSupabaseClient();
    if (client && dbConnected) {
      try { await client.from('buildings').delete().eq('id', id); } catch(err) {}
    }
  }, [showToast, dbConnected]);

  const handleAdd = useCallback(async newB => {
    setBuildings(prev => [...prev, newB]);
    showToast(`${newB.address} — added`);
    if (mapRef.current) mapRef.current.flyTo([newB.lat, newB.lng], 17, { duration: 1.2 });
    const client = getSupabaseClient();
    if (client && dbConnected) {
      try { await client.from('buildings').insert(mapBuildingToDb(newB)); } catch(err) {}
    }
  }, [showToast, dbConnected]);

  const fixPositionsFromAddresses = async () => {
    if (isFixingPos) return;
    setIsFixingPos(true);
    showToast(`Fixing ${buildings.length} building positions...`, 'info');
    const updatedList = [...buildings];
    let countFixed = 0;
    const client = getSupabaseClient();

    for (let i = 0; i < updatedList.length; i++) {
      const b = updatedList[i];
      showToast(`Geocoding (${i+1}/${updatedList.length}): ${b.address}...`, 'info');
      const results = await nominatim(b.address);
      if (results && results.length > 0) {
        const top = results[0];
        b.lat = top.lat;
        b.lng = top.lng;
        if (top.polygon) b.polygon = top.polygon;
        countFixed++;
        setBuildings([...updatedList]);
        if (client && dbConnected) {
          try { await client.from('buildings').upsert(mapBuildingToDb(b)); } catch(err) {}
        }
      }
      await new Promise(r => setTimeout(r, 450));
    }

    saveBuildings(updatedList);
    setIsFixingPos(false);
    showToast(`Fixed positions for ${countFixed} of ${buildings.length} buildings!`, 'success');
  };

  const handleSearchInput = v => {
    setSearchQ(v); setShowAc(true);
    clearTimeout(acTimer.current);
    if(v.length>=2){ setAcLoading(true); acTimer.current=setTimeout(async()=>{ setAcResults(await nominatim(v)); setAcLoading(false); },380); }
    else { setAcResults([]); setAcLoading(false); }
  };
  const pickAc = s => {
    setSearchQ(s.display); setShowAc(false); setAcResults([]);
    if(mapRef.current) mapRef.current.flyTo([s.lat,s.lng],17,{duration:1.2});
  };

  return (
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:10}}>

      {/* TOP BAR */}
      <div className="absolute top-0 left-0 right-0 z-20 px-3 pt-3 pointer-events-none">
        <div className="flex items-start gap-2 flex-wrap">

          <div className="glass rounded-2xl px-4 py-2.5 flex items-center gap-2.5 pointer-events-auto">
            <div className="w-7 h-7 rounded-lg flex items-center justify-center bg-gradient-to-br from-red-500 to-red-600">
              <Icon name="mapPin" size={13} cls="text-white"/>
            </div>
            <div>
              <p className="text-xs font-bold text-white leading-none">RedLine</p>
              <p className="text-[9px] text-slate-400 leading-none mt-1">Netanya · Poleg & Ir Yamim</p>
              <p className="text-[8px] text-blue-400 leading-none mt-0.5">lamama1234@gmail.com</p>
            </div>
          </div>

          <div className="flex gap-2 flex-wrap pointer-events-auto">
            <StatCard label="Total Target" value={fmt(stats.total)} icon="target" color="#fbbf24" sub={`${buildings.length} buildings`}/>
            <StatCard label="Committed" value={fmt(stats.committed)} icon="trending" color="#60a5fa" sub={`${stats.nCommitted} buildings`}/>
            <StatCard label="Collected" value={fmt(stats.paid)} icon="check" color="#34d399" sub={`${stats.nPaid} paid`}/>
          </div>

          {/* MAP VIEW / SATELLITE TOGGLE BUTTON */}
          <div className="glass rounded-2xl p-1 flex items-center gap-1 pointer-events-auto">
            <button onClick={()=>{setMapType('street');showToast('Switched to Street Map View','info');}}
              className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold t300 ${mapType==='street'?'bg-white/15 text-white':'text-slate-400 hover:text-white'}`}>
              <Icon name="map" size={12}/>
              <span>Street</span>
            </button>
            <button onClick={()=>{setMapType('satellite');showToast('Switched to Satellite View','info');}}
              className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold t300 ${mapType==='satellite'?'bg-white/15 text-white':'text-slate-400 hover:text-white'}`}>
              <Icon name="mapPin" size={12}/>
              <span>Satellite</span>
            </button>
          </div>

          <div className="glass rounded-2xl p-1 flex items-center gap-1 pointer-events-auto">
            <button onClick={()=>{setIsAdmin(false);setAddMode(false);showToast('Switched to Viewer Mode','info');}}
              className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold t300 ${!isAdmin?'bg-white/15 text-white':'text-slate-400 hover:text-white'}`}>
              <Icon name="eye" size={12}/>
              <span>Viewer</span>
            </button>
            <button onClick={()=>{ if(!isAdmin) setShowPwModal(true); }}
              className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold t300 ${isAdmin?'text-white':'text-slate-400 hover:text-white'}`}
              style={{background:isAdmin?'linear-gradient(135deg,#3b82f6,#2563eb)':''}}>
              <Icon name="shield" size={12}/>
              <span>Admin</span>
            </button>
          </div>

          {/* DATABASE SETTINGS ICON - ONLY VISIBLE TO ADMIN */}
          {isAdmin && (
            <button onClick={()=>setShowConfigModal(true)} title="Database Settings"
              className="glass rounded-2xl px-3 py-2 flex items-center gap-2 t300 hover:bg-white/15 pointer-events-auto">
              <div className={`w-2 h-2 rounded-full ${dbConnected ? 'bg-emerald-400 live-dot' : isOffline ? 'bg-red-400' : 'bg-amber-400 warn-dot'}`}/>
              <span className="text-[11px] font-medium text-slate-300 hidden md:inline">
                {dbConnected ? (realtimeActive ? 'Cloud Realtime' : 'Cloud DB') : 'Database'}
              </span>
              <Icon name="settings" size={12} cls="text-slate-400 hover:text-white"/>
            </button>
          )}

          {isAdmin && (
            <div className="flex gap-2 flex-wrap pointer-events-auto w-full pt-1">
              <button onClick={()=>{ setShowAddModal(true); setAddCoords(null); }}
                className="glass rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold text-emerald-400 hover:text-emerald-300 t300">
                <Icon name="plus" size={12}/> Add Building (Manual)
              </button>

              <button onClick={()=>{setAddMode(m=>!m); setAddCoords(null);}}
                className={`rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold t300 ${addMode?'text-white shadow-lg':'glass text-emerald-400 hover:text-emerald-300'}`}
                style={{background:addMode?'linear-gradient(135deg,#10b981,#059669)':''}}>
                <Icon name="mapPin" size={12}/>
                {addMode ? '🎯 Click map to place…' : 'Add via Map Selection'}
              </button>
              
              <button onClick={fixPositionsFromAddresses} disabled={isFixingPos}
                className="glass rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold text-indigo-400 hover:text-indigo-300 t300 disabled:opacity-40">
                {isFixingPos ? <div className="w-3 h-3 rounded-full border-2 border-slate-400 border-t-white spin"/> : <Icon name="compass" size={12}/>}
                {isFixingPos ? 'Fixing Positions...' : 'Fix Positions via Address'}
              </button>

              <button onClick={()=>{
                const hdr = ['ID','Address','Neighborhood','Units','Manager','Status','Target','Paid','Notes'];
                const rows = buildings.map(b => [b.id,`"${b.address}"`,b.neighborhood,b.units,`"${b.manager}"`,b.status,b.target,b.paid,`"${b.notes}"`]);
                const csv = [hdr,...rows].map(r=>r.join(',')).join('\n');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));
                a.download = `redline_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
              }} className="glass rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold text-sky-400 hover:text-sky-300 t300">
                <Icon name="download" size={12}/> Export CSV
              </button>
              <button onClick={()=>{
                if(confirm('Reset all buildings to defaults?')){
                  setBuildings(SEED);
                  localStorage.removeItem(STORE_KEY);
                  showToast('Reset to defaults','info');
                }
              }} className="glass rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold text-amber-400 hover:text-amber-300 t300">
                <Icon name="refresh" size={12}/> Reset
              </button>
              <button onClick={()=>{
                if(confirm('Delete ALL buildings?')){
                  setBuildings([]);
                  localStorage.setItem(STORE_KEY, JSON.stringify([]));
                  showToast('All buildings deleted','info');
                }
              }} className="glass rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold text-red-400 hover:text-red-300 t300 btn-danger">
                <Icon name="trash" size={12}/> Delete All
              </button>
            </div>
          )}
        </div>

        {/* PROGRESS BAR */}
        <div className="glass rounded-2xl p-3 mt-2 max-w-xl pointer-events-auto">
          <div className="flex justify-between items-center mb-1.5">
            <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Collection Progress</span>
            <span className="text-[10px] font-bold text-white">{fmtPct(stats.pPaid)} collected</span>
          </div>
          <div className="h-2 bg-white/10 rounded-full overflow-hidden relative">
            <div className="absolute top-0 left-0 h-full rounded-full t300" style={{width:`${stats.pComm}%`,background:'rgba(96,165,250,0.45)'}}/>
            <div className="absolute top-0 left-0 h-full rounded-full t300" style={{width:`${stats.pPaid}%`,background:'linear-gradient(90deg,#10b981,#34d399)'}}/>
          </div>
        </div>
      </div>

      {/* LEFT PANEL: SEARCH & LIST */}
      <div className="absolute left-3 z-25 pointer-events-none" style={{top:'220px', maxWidth:'260px', width:'100%'}}>
        <div className="relative mb-2 pointer-events-auto">
          <div className="glass rounded-2xl p-2">
            <div className="flex items-center gap-2">
              <Icon name="search" size={14} cls="text-slate-400 ml-1 flex-shrink-0"/>
              <input type="text" placeholder="Search address..." value={searchQ}
                onChange={e=>handleSearchInput(e.target.value)}
                onFocus={()=>searchQ.length>=2&&setShowAc(true)}
                onBlur={()=>setTimeout(()=>setShowAc(false),160)}
                style={{background:'transparent',border:'none',boxShadow:'none',padding:'4px 0',fontSize:'12px'}}/>
              {searchQ && <button onClick={()=>{setSearchQ('');setAcResults([]);setShowAc(false);}} className="text-slate-500 hover:text-white"><Icon name="x" size={12}/></button>}
            </div>
          </div>
          {showAc && (acResults.length>0||acLoading) && (
            <div className="autocomplete-dropdown absolute top-full left-0 right-0 mt-1 z-30 pointer-events-auto">
              {acResults.map((s,i)=>(
                <div key={i} className="autocomplete-item" onMouseDown={()=>pickAc(s)}>
                  <Icon name="mapPin" size={10} cls="text-blue-400 flex-shrink-0"/>
                  <span className="truncate">{s.display}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="flex gap-1.5 mb-2 flex-wrap pointer-events-auto">
          {[['','All'],['uncommitted','Uncommitted'],['committed','Committed'],['paid','Paid']].map(([val,lbl])=>(
            <button key={val} onClick={()=>setFilterStatus(val)}
              className={`px-2.5 py-1 rounded-full text-[10px] font-semibold t300 ${filterStatus===val?'text-white shadow-lg':'glass text-slate-400 hover:text-white'}`}
              style={{background:filterStatus===val?(val===''?'linear-gradient(135deg,#6366f1,#4f46e5)':val==='uncommitted'?'#475569':val==='committed'?'#2563eb':'#059669'):''}}>
              {lbl}
            </button>
          ))}
        </div>

        <button onClick={()=>setShowList(!showList)}
          className="glass w-full rounded-xl py-2 flex items-center justify-center gap-2 text-xs font-semibold text-slate-300 hover:text-white t300 mb-2 pointer-events-auto">
          <Icon name="building2" size={13}/>
          {showList?'Hide':'Show'} Building List
          <Icon name="chevron" size={12} cls={`t300 ${showList?'rotate-180':''}`}/>
        </button>

        {showList && (
          <div className="pointer-events-auto">
            <SidebarList buildings={buildings} filterStatus={filterStatus} searchQ={searchQ}
              isAdmin={isAdmin} onBuildingClick={b=>setSelectedBldg(b)} onClose={()=>setShowList(false)}/>
          </div>
        )}
      </div>

      {/* LEGEND */}
      <div className="absolute bottom-8 left-3 z-20 glass rounded-2xl p-3 pointer-events-auto">
        <p className="text-[9px] font-semibold text-slate-500 uppercase tracking-wider mb-2">Legend</p>
        {Object.entries(STATUS).map(([key,s])=>(
          <div key={key} className="flex items-center gap-2 mb-1.5 last:mb-0">
            <div className="w-3 h-3 rounded-sm border-2" style={{background:s.fill,borderColor:s.color,opacity:key==='uncommitted'?.5:1}}/>
            <span className="text-[10px] text-slate-300">{s.label}</span>
            <span className="text-[9px] text-slate-600 ml-auto">{buildings.filter(b=>b.status===key).length}</span>
          </div>
        ))}
      </div>

      {/* ADMIN MODE BADGE */}
      {isAdmin && (
        <div className="absolute bottom-8 right-16 z-25 pointer-events-none">
          <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold text-white shadow-xl"
               style={{background:'linear-gradient(135deg,#3b82f6,#2563eb)'}}>
            <Icon name="shield" size={11}/> ADMIN MODE
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && (
        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-50 rounded-xl px-4 py-2.5 flex items-center gap-2 text-sm font-medium text-white shadow-2xl fade-in-up pointer-events-none"
          style={{background:toast.type==='success'?'linear-gradient(135deg,rgba(16,185,129,0.92),rgba(5,150,105,0.92))':'linear-gradient(135deg,rgba(59,130,246,0.92),rgba(37,99,235,0.92))'}}>
          <Icon name={toast.type==='success'?'check':'info'} size={14}/>
          {toast.msg}
        </div>
      )}

      {/* MODALS - ADMIN ONLY */}
      {isAdmin && showConfigModal && <ConfigModal onClose={()=>setShowConfigModal(false)} onSaved={()=>showToast('Supabase settings updated','success')}/>}
      {showPwModal && <AdminPasswordModal onSuccess={()=>{ setIsAdmin(true); setShowPwModal(false); showToast('Admin mode unlocked','info'); }} onCancel={()=>setShowPwModal(false)}/>}
      {isAdmin && selectedBldg && <BuildingModal building={selectedBldg} onClose={()=>setSelectedBldg(null)} onSave={handleSave} onDelete={handleDelete}/>}
      {isAdmin && showAddModal && <AddBuildingModal initialLat={addCoords?.lat} initialLng={addCoords?.lng} initialAddress={addCoords?.address} initialStreet={addCoords?.street} initialPolygon={addCoords?.polygon} onClose={()=>{ setShowAddModal(false); setAddCoords(null); }} onAdd={handleAdd}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
