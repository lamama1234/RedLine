<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RedLine — Netanya Community Project Payments</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="env-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; }
    #map { position: fixed; inset: 0; z-index: 0; }

    .leaflet-popup-content-wrapper {
      background: rgba(15,23,42,0.96); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; backdrop-filter: blur(16px); color: #f1f5f9;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: rgba(15,23,42,0.96); }
    .leaflet-popup-content { margin: 0; padding: 0; }
    .leaflet-container { background: #0f172a; }

    .glass {
      background: rgba(15,23,42,0.85);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.10);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }

    .t300 { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }

    .modal-backdrop { background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); }

    .custom-tooltip {
      background: rgba(10,15,28,0.97) !important;
      border: 1px solid rgba(255,255,255,0.14) !important;
      border-radius: 10px !important; color: #f1f5f9 !important;
      font-family: 'Inter', sans-serif !important; font-size: 12px !important;
      padding: 8px 12px !important; white-space: nowrap;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8) !important;
    }
    .leaflet-tooltip-top.custom-tooltip::before { border-top-color: rgba(10,15,28,0.97) !important; }

    .badge-uncommitted { background: rgba(100,116,139,0.25); color: #94a3b8; border: 1px solid rgba(100,116,139,0.4); }
    .badge-committed   { background: rgba(59,130,246,0.25); color: #93c5fd; border: 1px solid rgba(59,130,246,0.45); }
    .badge-paid        { background: rgba(16,185,129,0.25); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.45); }

    input[type="text"], input[type="number"], input[type="password"], select, textarea {
      background: rgba(255,255,255,0.06) !important;
      border: 1px solid rgba(255,255,255,0.13) !important;
      color: #f1f5f9 !important; border-radius: 8px !important;
      padding: 8px 12px !important; outline: none !important;
      transition: border-color 0.2s; width: 100%;
    }
    input[type="text"]:focus, input[type="number"]:focus,
    input[type="password"]:focus, select:focus, textarea:focus {
      border-color: rgba(59,130,246,0.65) !important;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15) !important;
    }
    input::placeholder { color: rgba(148,163,184,0.45) !important; }
    select option { background: #1e293b; color: #f1f5f9; }
    input[type="radio"] { accent-color: #3b82f6; }

    @media (max-width: 640px) {
      .modal-panel { width: 100vw !important; max-width: 100vw !important;
        border-radius: 20px 20px 0 0 !important; max-height: 92vh; overflow-y: auto; }
    }

    @keyframes shake {
      10%,90% { transform: translate3d(-2px,0,0); }
      20%,80% { transform: translate3d(4px,0,0); }
      30%,50%,70% { transform: translate3d(-6px,0,0); }
      40%,60% { transform: translate3d(6px,0,0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInUp {
      from { opacity:0; transform: translateY(8px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.25s ease-out; }

    .autocomplete-dropdown {
      background: rgba(10,15,30,0.98); backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.65); overflow: hidden;
      max-height: 220px; overflow-y: auto;
    }
    .autocomplete-item {
      padding: 9px 14px; font-size: 11px; color: #cbd5e1; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; gap: 8px; transition: background 0.15s;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: rgba(59,130,246,0.2); color: #fff; }
    .autocomplete-item.ac-loading { color: #475569; font-style: italic; cursor: default; }

    /* ── Add-mode crosshair cursor on map ── */
    .map-add-mode { cursor: crosshair !important; }
    .map-add-mode .leaflet-interactive { cursor: crosshair !important; }

    /* ── Pulsing "click to place" ring ── */
    @keyframes addPing { 0%{opacity:.7;transform:scale(1)} 100%{opacity:0;transform:scale(2.5)} }
    .add-ping { animation: addPing 1.1s ease-out infinite; }

    /* ── OSM polygon highlight ── */
    .leaflet-interactive:focus { outline: none; }

    /* ── Danger button ── */
    .btn-danger { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.22); color: #fca5a5; }

    /* ── Spinner inline ── */
    .spin { animation: spin 0.7s linear infinite; }
    /* ── Realtime & Status indicator animations ── */
    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .live-dot { animation: livePulse 2s infinite; }
    
    @keyframes warnPulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    .warn-dot { animation: warnPulse 2s infinite; }
  </style>
</head>

// Dynamic Environment Config (reads window.ENV injected via .env/Vite/hosting, falls back to localStorage/defaults)
function getEnvConfig() {
  const runtime = window.ENV || {};
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(SUPABASE_KEY) || '{}'); } catch(e) {}
  return {
    url: saved.url || runtime.VITE_SUPABASE_URL || '',
    anonKey: saved.anonKey || runtime.VITE_SUPABASE_ANON_KEY || '',
    adminPasscode: runtime.VITE_ADMIN_PASSCODE || saved.adminPasscode || 'KavAdom1',
  };
}

let supabaseClient = null;
function getSupabaseClient() {
  if (supabaseClient) return supabaseClient;
  const cfg = getEnvConfig();
  if (cfg.url && cfg.anonKey && window.supabase && typeof window.supabase.createClient === 'function') {
    try {
      supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
    } catch(e) {
      console.warn('Could not initialize Supabase client:', e);
    }
  }
  return supabaseClient;
}

// Database <-> Client schema adapters
function mapDbToBuilding(row) {
  return {
    id: row.id,
    address: row.address,
    street: row.street || row.address,
    neighborhood: row.neighborhood || 'Ir Yamim',
    units: row.units || 40,
    manager: row.manager || '',
    status: row.status || 'uncommitted',
    target: Number(row.target_ils !== undefined ? row.target_ils : (row.target || 5000)),
    paid: Number(row.paid_ils !== undefined ? row.paid_ils : (row.paid || 0)),
    lat: Number(row.lat),
    lng: Number(row.lng),
    polygon: row.polygon || (typeof SEED_POLYGONS !== 'undefined' ? SEED_POLYGONS[row.id] : null) || null,
    notes: row.notes || '',
    updated_at: row.updated_at || new Date().toISOString()
  };
}

function mapBuildingToDb(b) {
  return {
    id: b.id,
    address: b.address,
    street: b.street || b.address,
    neighborhood: b.neighborhood || 'Ir Yamim',
    units: Number(b.units || 40),
    manager: b.manager || '',
    status: b.status || 'uncommitted',
    target_ils: Number(b.target || 0),
    paid_ils: Number(b.paid || 0),
    lat: Number(b.lat),

  };
}

const uid = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

function loadBuildings() {
  try {
    const r = localStorage.getItem(STORE_KEY);
    if (r) {
      const data = JSON.parse(r);
      return data.map(b => b.polygon ? b : { ...b, polygon: SEED_POLYGONS[b.id] || null });
    }
  } catch {}
  return SEED.map(b => ({ ...b, polygon: SEED_POLYGONS[b.id] || null }));
}
function saveBuildings(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch {}
}

function exportCSV(buildings) {
  const hdr = ['ID','Address','Neighborhood','Street','Units','Manager','Status','Target (ILS)','Paid (ILS)','Lat','Lng','Notes'];
  const rows = buildings.map(b => [b.id,`"${b.address}"`,b.neighborhood,`"${b.street}"`,b.units,`"${b.manager}"`,b.status,b.target,b.paid,b.lat,b.lng,`"${b.notes}"`]);
  const csv = [hdr,...rows].map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download = `redline_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

async function reverseLookup(lat, lng) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&polygon_geojson=1&accept-language=he,en`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'he,en' } });
    const data = await res.json();
    const parts = (data.display_name || '').split(',').map(s => s.trim());
    const address = parts.slice(0, 3).join(', ') || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    const street = (data.address && (data.address.road || data.address.pedestrian || data.address.suburb)) || parts[0] || '';
    let polygon = null;
    if (data.geojson && (data.geojson.type === 'Polygon' || data.geojson.type === 'MultiPolygon')) {
      polygon = data.geojson.coordinates;
    }
    return { address, street, polygon };
  } catch (e) {
    return { address: `${lat.toFixed(5)}, ${lng.toFixed(5)}`, street: '', polygon: null };
  }
}

async function nominatim(query) {
  if (!query || query.length < 2) return [];
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query+' נתניה')}&format=json&limit=6&countrycodes=il&accept-language=he,en&bounded=1&viewbox=34.82,32.31,34.88,32.25`;
    const data = await (await fetch(url,{headers:{'Accept-Language':'he,en'}})).json();
    return data.map(x=>({display:x.display_name.split(',').slice(0,3).join(', '),lat:+x.lat,lng:+x.lon}));
  } catch { return []; }
}

// ─── OVERPASS — fetch OSM building polygons ───────────────────────────────────
async function fetchOSMBuildings() {
  try {
    const query = `[out:json][timeout:25];(way["building"](${OVERPASS_BBOX});relation["building"](${OVERPASS_BBOX}););out body;>;out skel qt;`;
    const res = await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST', body:'data='+encodeURIComponent(query),
      headers:{'Content-Type':'application/x-www-form-urlencoded'}
    });
    const json = await res.json();

    // Build node lookup
    const nodes = {};
    json.elements.forEach(e => { if(e.type==='node') nodes[e.id]={lat:e.lat,lng:e.lon}; });

    // Build GeoJSON features for ways
    const features = [];
    json.elements.forEach(e => {
      if(e.type==='way' && e.nodes) {
        const coords = e.nodes.map(nid => nodes[nid]).filter(Boolean);
        if(coords.length < 3) return;
        // close ring
        if(coords[0].lat !== coords[coords.length-1].lat) coords.push(coords[0]);
        // GeoJSON lon,lat order
        const ring = coords.map(c=>[c.lng,c.lat]);
        // Centroid for snapping
        const cLat = coords.reduce((s,c)=>s+c.lat,0)/coords.length;
        const cLng = coords.reduce((s,c)=>s+c.lng,0)/coords.length;
        features.push({
          type:'Feature',
          properties:{ osmId: e.id, centLat: cLat, centLng: cLng },
          geometry:{ type:'Polygon', coordinates:[ring] }
        });
      }
    });
    return features;
  } catch(e) {
    console.warn('Overpass fetch failed:', e);
    return [];
  }
}

    if (!url || !anonKey) {

  const [acLoading,    setAcLoading]    = useState(false);
  const [showAc,       setShowAc]       = useState(false);
  const acTimer = useRef(null);

  const handleAcInput = v => {
    setAcQuery(v); setAddress(v); setShowAc(true);
    clearTimeout(acTimer.current);
    if(v.length>=2){ setAcLoading(true); acTimer.current=setTimeout(async()=>{ setAcResults(await nominatim(v)); setAcLoading(false); },380); }
    else { setAcResults([]); setAcLoading(false); }
  };

  const pickAc = s => {
    setAddress(s.display); setAcQuery(s.display);
    setLat(s.lat.toFixed(6)); setLng(s.lng.toFixed(6));
    setShowAc(false); setAcResults([]);
  };

  const valid = address.trim() && lat && lng && manager.trim();

  const save = () => {
    if(!valid) return;
    onAdd({
      id: uid(), address: address.trim(), street: street.trim() || address.trim(),
      neighborhood, units: Number(units), manager: manager.trim(),
      target: Number(target), lat: parseFloat(lat), lng: parseFloat(lng),
      polygon: buildingPoly,
      status: 'uncommitted', paid: 0, notes: '',
    });
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center modal-backdrop"
         onClick={e=>e.target===e.currentTarget&&onClose()} style={{pointerEvents:'all'}}>
      <div className="glass modal-panel w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden fade-in-up"
           style={{border:'1px solid rgba(255,255,255,0.14)'}}>
        {/* Header */}
        <div className="flex items-center justify-between p-5 border-b border-white/10">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:'linear-gradient(135deg,#10b981,#059669)'}}>
              <Icon name="plus" size={15} cls="text-white"/>
            </div>
            <div>
              <p className="text-sm font-bold text-white">Add New Building</p>
              <p className="text-[10px] text-slate-500">
                {initialLat ? `Placed at ${parseFloat(lat).toFixed(4)}, ${parseFloat(lng).toFixed(4)}` : 'Fill in the details below'}
              </p>
            </div>
          </div>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white t300" style={{pointerEvents:'all'}}>
            <Icon name="x" size={17}/>
          </button>
        </div>

        <div className="p-5 space-y-3 max-h-[70vh] overflow-y-auto">
          {/* Address with autocomplete */}
          <div className="relative">
            <p className="text-[10px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Address *</p>
            <input type="text" value={acQuery} onChange={e=>handleAcInput(e.target.value)}
              onFocus={()=>acQuery.length>=2&&setShowAc(true)}
              onBlur={()=>setTimeout(()=>setShowAc(false),160)}
              placeholder="e.g. שדרות שז׳ר 1, נתניה" style={{pointerEvents:'all'}}/>
            {showAc && (acResults.length>0 || acLoading) && (
              <div className="autocomplete-dropdown absolute left-0 right-0 top-full mt-1 z-10" style={{pointerEvents:'all'}}>
                {acLoading && acResults.length===0 && <div className="autocomplete-item ac-loading">
                  <div className="w-3 h-3 rounded-full border-2 border-slate-700 border-t-blue-400 spin flex-shrink-0"/>Searching...
                </div>}
                {acResults.map((s,i)=>(
                  <div key={i} className="autocomplete-item" onMouseDown={()=>pickAc(s)}>
                    <Icon name="mapPin" size={10} cls="text-blue-400 flex-shrink-0"/>
                    <span className="truncate">{s.display}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Street */}
          <div>
            <p className="text-[10px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Street Name</p>
            <input type="text" value={street} onChange={e=>setStreet(e.target.value)}
              placeholder="e.g. שדרות שז׳ר" style={{pointerEvents:'all'}}/>
          </div>

          {/* Neighborhood + Units row */}
          <div className="grid grid-cols-2 gap-3">
            <div>
              <p className="text-[10px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Neighborhood</p>
              <select value={neighborhood} onChange={e=>setNeighborhood(e.target.value)} style={{pointerEvents:'all'}}>
                <option value="Ir Yamim">Ir Yamim</option>
                <option value="Poleg">Poleg</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div>
              <p className="text-[10px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Units</p>
              <input type="number" value={units} min={1} max={500}
                onChange={e=>setUnits(e.target.value)} style={{pointerEvents:'all'}}/>
            </div>
          </div>

          {/* Manager + Target row */}
          <div className="grid grid-cols-2 gap-3">
            <div>
              <p className="text-[10px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Building Manager *</p>
              <input type="text" value={manager} onChange={e=>setManager(e.target.value)}
                placeholder="ועד בית" style={{pointerEvents:'all'}}/>
            </div>
            <div>
              <p className="text-[10px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Target Amount (₪)</p>
              <input type="number" value={target} min={0}
                onChange={e=>setTarget(e.target.value)} style={{pointerEvents:'all'}}/>
            </div>
          </div>

          {/* Coordinates */}
          <div className="grid grid-cols-2 gap-3">
            <div>
              <p className="text-[10px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Latitude *</p>
              <input type="number" value={lat} step={0.00001}
                onChange={e=>setLat(e.target.value)} placeholder="32.xxxx" style={{pointerEvents:'all'}}/>
            </div>
            <div>
              <p className="text-[10px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Longitude *</p>
              <input type="number" value={lng} step={0.00001}
                onChange={e=>setLng(e.target.value)} placeholder="34.xxxx" style={{pointerEvents:'all'}}/>
            </div>
          </div>
          {!initialLat && (
            <p className="text-[10px] text-blue-400 flex items-center gap-1">
              <Icon name="info" size={11}/> Tip: Close this and click on the map to auto-fill coordinates.
            </p>
          )}

          <div className="flex gap-3 pt-2">
            <button onClick={onClose} style={{pointerEvents:'all'}}
              className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:text-white hover:bg-white/10 border border-white/10 t300">
              Cancel
            </button>
            <button onClick={save} disabled={!valid} style={{
              background: valid ? 'linear-gradient(135deg,#10b981,#059669)' : 'rgba(255,255,255,0.06)',
              pointerEvents:'all'
            }} className="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white t300 disabled:opacity-40">
              Add Building
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── SIDEBAR LIST ────────────────────────────────────────────────────────────
const SidebarList = ({buildings, filterStatus, searchQ, isAdmin, onBuildingClick, onClose}) => {
  const filtered = useMemo(()=>buildings.filter(b=>{
    const ms = !searchQ || b.address.toLowerCase().includes(searchQ.toLowerCase()) || b.street.toLowerCase().includes(searchQ.toLowerCase());
    const mf = !filterStatus || b.status===filterStatus;
    return ms && mf;
  }),[buildings,filterStatus,searchQ]);

  return (
    <div className="glass rounded-2xl overflow-hidden" style={{maxHeight:'calc(100vh - 330px)',display:'flex',flexDirection:'column'}}>
      <div className="flex items-center justify-between px-4 py-3 border-b border-white/10">
        <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Buildings ({filtered.length})</span>
        <button onClick={onClose} className="p-1 rounded hover:bg-white/10 text-slate-500 hover:text-white t300" style={{pointerEvents:'all'}}>
          <Icon name="x" size={13}/>
        </button>
      </div>
      <div style={{overflowY:'auto',flex:1}}>
        {filtered.length===0 && <div className="p-5 text-center text-slate-500 text-xs">No buildings match.</div>}
        {filtered.map(b=>(
          <div key={b.id} onClick={()=>isAdmin&&onBuildingClick(b)}
            className={`px-4 py-3 border-b border-white/5 flex items-start justify-between gap-2 ${isAdmin?'cursor-pointer hover:bg-white/5':''} t300`}
            style={{pointerEvents:'all'}}>
            <div className="flex-1 min-w-0">
              <p className="text-xs font-semibold text-white truncate">{b.address}</p>
              <p className="text-[10px] text-slate-500">{b.neighborhood} · {b.units} units</p>
              {b.status==='paid' && <p className="text-[10px] text-emerald-400 mt-0.5">{fmt(b.paid)} paid</p>}
            </div>
            <Badge status={b.status}/>
          </div>
        ))}
      </div>
    </div>
  );
};

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const [buildings,      setBuildings]      = useState(loadBuildings);
  const [isAdmin,        setIsAdmin]        = useState(false);
  const [showPwModal,    setShowPwModal]    = useState(false);
  const [showConfigModal,setShowConfigModal]= useState(false);
  const [selectedBldg,   setSelectedBldg]   = useState(null);  // for edit
  const [addMode,        setAddMode]        = useState(false);  // map-click-to-add active
  const [addCoords,      setAddCoords]      = useState(null);   // {lat,lng} from map click
  const [showAddModal,   setShowAddModal]   = useState(false);
  const [searchQ,        setSearchQ]        = useState('');
  const [acResults,      setAcResults]      = useState([]);
  const [acLoading,      setAcLoading]      = useState(false);
  const [showAc,         setShowAc]         = useState(false);
  const [filterStatus,   setFilterStatus]   = useState('');
  const [showList,       setShowList]       = useState(false);
  const [toast,          setToast]          = useState(null);
  const [osmFeatures,    setOsmFeatures]    = useState([]);
  const [osmLoading,     setOsmLoading]     = useState(false);
  
  // Realtime & Cloud sync state
  const [dbLoading,      setDbLoading]      = useState(false);
  const [dbConnected,    setDbConnected]    = useState(false);
  const [isOffline,      setIsOffline]      = useState(!navigator.onLine);
  const [realtimeActive, setRealtimeActive] = useState(false);

  const mapRef       = useRef(null);
  const markersRef   = useRef({});       // circle/label markers per building id
  const osmLayerRef  = useRef(null);     // L.geoJSON layer for OSM polygons
  const tempMarkerRef = useRef(null);    // pulsing pin during add-mode
  const toastTimer   = useRef(null);
  const acTimer      = useRef(null);
  const searchRef    = useRef(null);

  const showToast = useCallback((msg,type='success')=>{
    setToast({msg,type});
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToast(null), 3200);
  },[]);

  const stats = useMemo(()=>{
    const total     = buildings.reduce((s,b)=>s+b.target,0);
    const committed = buildings.filter(b=>b.status==='committed').reduce((s,b)=>s+b.target,0);
    const paid      = buildings.filter(b=>b.status==='paid').reduce((s,b)=>s+b.paid,0);
    const pPaid     = total>0?(paid/total)*100:0;
    const pComm     = total>0?((paid+committed)/total)*100:0;
    return { total, committed, paid, pPaid, pComm,
      nPaid:       buildings.filter(b=>b.status==='paid').length,
      nCommitted:  buildings.filter(b=>b.status==='committed').length,
      nUncommitted:buildings.filter(b=>b.status==='uncommitted').length };
  },[buildings]);

  // ── Online / Offline Network detection ─────────────────────────────────────
  useEffect(() => {
    const handleOnline = () => setIsOffline(false);
    const handleOffline = () => setIsOffline(true);
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    return () => {
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
    };
  }, []);

  // ── Supabase Initial Fetch & Multi-User Realtime Subscription ──────────────
  useEffect(() => {
    const client = getSupabaseClient();
    if (!client) {
      setDbConnected(false);
      setRealtimeActive(false);
      return;
    }

    let channel = null;
    let isMounted = true;

    async function initSupabase() {
      setDbLoading(true);
      try {
        const { data, error } = await client.from('buildings').select('*').order('id', { ascending: true });
        if (error) throw error;
        if (isMounted) {
          if (data && data.length > 0) {
            const mapped = data.map(mapDbToBuilding);
            setBuildings(mapped);
            saveBuildings(mapped);
            showToast('Real-time database synchronized', 'success');
          } else {
            // First time DB setup: seed default buildings to Supabase
            const dbSeed = SEED.map(mapBuildingToDb);
            await client.from('buildings').upsert(dbSeed);
          }
          setDbConnected(true);
        }
      } catch (err) {
        console.warn('Supabase fetch notice:', err.message);
        if (isMounted) setDbConnected(false);
      } finally {
        if (isMounted) setDbLoading(false);
      }

      // Establish Postgres Changes Realtime broadcast listener
      try {
        channel = client
          .channel('public:buildings')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'buildings' }, payload => {
            if (!isMounted) return;
            const eventType = payload.eventType;
            if (eventType === 'INSERT') {
              const newBuilding = mapDbToBuilding(payload.new);
              setBuildings(prev => {
                if (prev.some(b => b.id === newBuilding.id)) return prev;
                return [...prev, newBuilding];
              });
              showToast(`New building added: ${payload.new.address}`, 'info');
            } else if (eventType === 'UPDATE') {
              const updated = mapDbToBuilding(payload.new);
              setBuildings(prev => prev.map(b => b.id === updated.id ? updated : b));
              // Also update selected building in modal if open
              setSelectedBldg(prev => (prev && prev.id === updated.id ? updated : prev));
              showToast(`Real-time update: ${updated.address} (${updated.status.toUpperCase()})`, 'info');
            } else if (eventType === 'DELETE') {
              const delId = payload.old.id;
              setBuildings(prev => prev.filter(b => b.id !== delId));
              setSelectedBldg(prev => (prev && prev.id === delId ? null : prev));
              showToast('Building removed via real-time update', 'info');
            }
          })
          .subscribe(status => {
            if (isMounted) {
              setRealtimeActive(status === 'SUBSCRIBED');
              if (status === 'SUBSCRIBED') setDbConnected(true);
            }
          });
      } catch (err) {
        console.warn('Realtime subscription error:', err);
      }
    }

    initSupabase();

    return () => {
      isMounted = false;
      if (channel && client) client.removeChannel(channel);
    };
  }, []);

  // ── Init Map ──────────────────────────────────────────────────────────────
  useEffect(()=>{
    const map = L.map('map',{center:CENTER, zoom:ZOOM, minZoom:13, maxZoom:18, zoomControl:false, attributionControl:false});

    // Open source satellite imagery from Esri World Imagery (No API key required)
    // Strictly capped at zoom 18 so satellite tiles are always available and never blank
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      minZoom: 13,
      maxZoom: 18,
      maxNativeZoom: 18,
      attribution: '© <a href="https://www.esri.com">Esri</a>, Maxar, Earthstar Geographics'
    }).addTo(map);

    L.control.zoom({position:'bottomright'}).addTo(map);
    L.control.attribution({position:'bottomleft', prefix:'© <a href="https://www.esri.com">Esri</a> · <a href="https://osm.org">OSM</a>'}).addTo(map);

    mapRef.current = map;
    return ()=>map.remove();
  },[]);

  // ── Fetch OSM building polygons ───────────────────────────────────────────
  useEffect(()=>{
    setOsmLoading(true);
    fetchOSMBuildings().then(features=>{
      setOsmFeatures(features);
      setOsmLoading(false);
    });
  },[]);

  // ── Render actual building footprints coloured by payment status ──────────
  useEffect(()=>{
    const map = mapRef.current;
    if(!map) return;

    if(osmLayerRef.current) { map.removeLayer(osmLayerRef.current); osmLayerRef.current=null; }

    const buildingFeatures = [];
    buildings.forEach(b => {
      let coords = b.polygon;
      if (!coords) {
        // Fallback realistic ~25m building footprint if polygon not downloaded
        const dlat = 0.00016, dlng = 0.00024;
        coords = [[[b.lng - dlng, b.lat - dlat],
                   [b.lng + dlng, b.lat - dlat],
                   [b.lng + dlng, b.lat + dlat],
                   [b.lng - dlng, b.lat + dlat],
                   [b.lng - dlng, b.lat - dlat]]];
      }
      buildingFeatures.push({
        type: 'Feature',
        properties: { buildingId: b.id },
        geometry: {
          type: coords.length > 1 && Array.isArray(coords[0][0][0]) ? 'MultiPolygon' : 'Polygon',
          coordinates: coords
        }
      });
    });

    const layer = L.geoJSON({ type: 'FeatureCollection', features: buildingFeatures }, {
      style: feature => {
        const b = buildings.find(x => x.id === feature.properties.buildingId);
        if (!b) return { opacity: 0, fillOpacity: 0 };
        const s = STATUS[b.status];
        return {
          color: s.color,
          weight: b.status === 'uncommitted' ? 2 : 3,
          fillColor: s.fill,
          fillOpacity: s.fillOpacity + 0.1,
          opacity: 0.95
        };
      },
      onEachFeature: (feature, leafletLayer) => {
        const b = buildings.find(x => x.id === feature.properties.buildingId);
        if (!b) return;
        const s = STATUS[b.status];
        const tip = `<div style="padding:4px">
          <strong style="color:#f1f5f9;font-size:12px;">${b.address}</strong><br/>
          <span style="color:#94a3b8;font-size:10px;">📍 ${b.neighborhood}</span>
          <div style="margin-top:4px;">Status: <span style="color:${s.color};font-weight:600">${s.label}</span></div>
          ${b.status === 'paid'
            ? `<div>Paid: <span style="color:#34d399;font-weight:700">${fmt(b.paid)}</span> / ${fmt(b.target)}</div>`
            : `<div>Target: <span style="color:#fbbf24;font-weight:600">${fmt(b.target)}</span></div>`}
          <div style="color:#64748b;font-size:10px;margin-top:2px">🏠 ${b.units} units · 👤 ${b.manager}</div>
        </div>`;
        leafletLayer.bindTooltip(tip, { className: 'custom-tooltip', direction: 'top', sticky: true, opacity: 1 });
        leafletLayer.on('click', () => {
          if (isAdmin) {
            setSelectedBldg(b);
          }
        });
      }
    });

    layer.addTo(map);
    osmLayerRef.current = layer;
  },[buildings, isAdmin]);

  // ── Point markers (labels + centre dots) ─────────────────────────────────
  useEffect(()=>{
    const map = mapRef.current;
    if(!map) return;
    Object.values(markersRef.current).forEach(m=>map.removeLayer(m));
    markersRef.current = {};

    const vis = buildings.filter(b=>{
      const ms = !searchQ || b.address.toLowerCase().includes(searchQ.toLowerCase()) || b.street.toLowerCase().includes(searchQ.toLowerCase());
      const mf = !filterStatus || b.status===filterStatus;
      return ms && mf;
    });

    vis.forEach(b=>{
      const s = STATUS[b.status];
      const r = 14 + Math.min(b.units/12, 10);
      const sz = r*2+10;
      const ip = b.status==='paid', ic = b.status==='committed';
      const svg = `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg">
        ${ip?`<circle cx="${sz/2}" cy="${sz/2}" r="${sz/2-1}" fill="${s.fill}" fill-opacity="0.1" stroke="${s.color}" stroke-width="1" stroke-dasharray="3 2"/>`:''}
        <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="${s.fill}"
          fill-opacity="${ip?.55:ic?.32:.08}" stroke="${s.color}"
          stroke-width="${b.status==='uncommitted'?1.4:2.2}" stroke-opacity="${b.status==='uncommitted'?.5:.9}"/>
        ${ip?`<path d="M${sz/2-4},${sz/2} l3,3 l5.5,-5.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
           :ic?`<circle cx="${sz/2}" cy="${sz/2}" r="4.5" fill="${s.color}" fill-opacity="0.85"/>`
           :`<circle cx="${sz/2}" cy="${sz/2}" r="3" fill="${s.color}" fill-opacity="0.5"/>`}
      </svg>`;

      const icon = L.divIcon({html:svg, className:'', iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], tooltipAnchor:[sz/2,-sz/2]});
      const m = L.marker([b.lat,b.lng],{icon,interactive:true});

      const tip = `<div style="padding:3px">
        <strong style="color:#f1f5f9;font-size:12px">${b.address}</strong><br/>
        <span style="color:#94a3b8;font-size:10px">📍 ${b.neighborhood}</span>
        <div style="margin-top:3px">Status: <span style="color:${s.color};font-weight:600">${s.label}</span></div>
        ${b.status==='paid'
          ?`<div>Paid: <span style="color:#34d399;font-weight:700">${fmt(b.paid)}</span> / ${fmt(b.target)}</div>`
          :`<div>Target: <span style="color:#fbbf24;font-weight:600">${fmt(b.target)}</span></div>`}
        <div style="color:#64748b;font-size:10px;margin-top:2px">🏠 ${b.units} units · 👤 ${b.manager}</div>
      </div>`;
      m.bindTooltip(tip,{className:'custom-tooltip',direction:'top',offset:[0,-sz/2],opacity:1});

      if(ip){
        const li = L.divIcon({
          html:`<div style="background:rgba(16,185,129,0.92);color:white;font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.35);border:1px solid rgba(52,211,153,0.5)">${fmt(b.paid)}</div>`,
          className:'', iconAnchor:[0,sz/2+6]
        });
        const lm = L.marker([b.lat,b.lng],{icon:li,interactive:false,zIndexOffset:-1});
        lm.addTo(map); markersRef.current[`${b.id}_lbl`]=lm;
      }

      m.on('click',()=>{
        setBuildings(prev=>{
          const cur=prev.find(x=>x.id===b.id);
          if(cur) setSelectedBldg(cur);
          return prev;
        });
      });
      m.addTo(map);
      markersRef.current[b.id]=m;
    });
  },[buildings, searchQ, filterStatus]);

  // ── Add-mode: map cursor + click handler ─────────────────────────────────
  useEffect(()=>{
    const map = mapRef.current;
    if(!map) return;
    const container = map.getContainer();

    const handleMapClick = async e => {
      // In Admin Mode: clicking on the map (or button) lets you add a building at that exact spot!
      if (!isAdmin && !addMode) return;

      // Check if user clicked an existing building
      const clickLat = e.latlng.lat, clickLng = e.latlng.lng;
      const distM = (lat1,lng1,lat2,lng2) => {
        const dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
        const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
        return 6371000*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
      };
      const existing = buildings.find(b => distM(b.lat, b.lng, clickLat, clickLng) < 25);
      if (existing) {
        if (isAdmin) setSelectedBldg(existing);
        return;
      }

      // If in addMode OR admin double click/click:
      if (addMode || isAdmin) {
        if (tempMarkerRef.current){ map.removeLayer(tempMarkerRef.current); tempMarkerRef.current=null; }
        const pingIcon = L.divIcon({
          html:`<div style="position:relative;width:20px;height:20px">
            <div class="add-ping" style="position:absolute;inset:0;border-radius:50%;border:3px solid #10b981;"></div>
            <div style="position:absolute;inset:4px;border-radius:50%;background:#10b981"></div>
          </div>`,
          className:'', iconSize:[20,20], iconAnchor:[10,10]
        });
        tempMarkerRef.current = L.marker([clickLat, clickLng],{icon:pingIcon,interactive:false}).addTo(map);
        
        // Reverse geocode to auto-fill address & building footprint
        showToast('Looking up building data...', 'info');
        const info = await reverseLookup(clickLat, clickLng);
        setAddCoords({ lat: clickLat, lng: clickLng, address: info.address, street: info.street, polygon: info.polygon });
        setAddMode(false);
        setShowAddModal(true);
      }
    };

    if(addMode || isAdmin){
      container.classList.add('map-add-mode');
      map.on('click',handleMapClick);
    } else {
      container.classList.remove('map-add-mode');
      map.off('click',handleMapClick);
    }
    return ()=>{ map.off('click',handleMapClick); container.classList.remove('map-add-mode'); };
  },[addMode, isAdmin, buildings]);

  // Clean up temp marker when modal closes
  useEffect(()=>{
    if(!showAddModal && tempMarkerRef.current && mapRef.current){
      mapRef.current.removeLayer(tempMarkerRef.current);
      tempMarkerRef.current=null;
    }
  },[showAddModal]);

  // ── OSM polygon click: open edit modal only in admin mode ─────────────────
  useEffect(()=>{
    const layer = osmLayerRef.current;
    if(!layer) return;
    // OSM click is wired in onEachFeature but only triggers setSelectedBldg;
    // the modal is gated by isAdmin in JSX.
  },[isAdmin, osmLayerRef.current]);

  useEffect(()=>{ saveBuildings(buildings); },[buildings]);

  const handleSave = useCallback(async updated => {
    // Optimistic UI update
    setBuildings(prev => prev.map(b => b.id === updated.id ? updated : b));
    showToast(`${updated.address} — saved`);

    const client = getSupabaseClient();
    if (client && dbConnected) {
      try {
        const { error } = await client.from('buildings').upsert(mapBuildingToDb(updated));
        if (error) throw error;
      } catch(err) {
        console.warn('Supabase save error:', err);
        showToast('Saved locally (Cloud sync failed)', 'info');
      }
    }
  }, [showToast, dbConnected]);

  const handleDelete = useCallback(async id => {
    setBuildings(prev => prev.filter(b => b.id !== id));
    showToast('Building deleted', 'info');

    const client = getSupabaseClient();
    if (client && dbConnected) {
      try {
        const { error } = await client.from('buildings').delete().eq('id', id);
        if (error) throw error;
      } catch(err) {
        console.warn('Supabase delete error:', err);
      }
    }
  }, [showToast, dbConnected]);

  const handleAdd = useCallback(async newB => {
    setBuildings(prev => [...prev, newB]);
    showToast(`${newB.address} — added`);

    const client = getSupabaseClient();
    if (client && dbConnected) {
      try {
        const { error } = await client.from('buildings').insert(mapBuildingToDb(newB));
        if (error) throw error;
      } catch(err) {
        console.warn('Supabase add error:', err);
      }
    }
  }, [showToast, dbConnected]);

  const handleBuildingClick = useCallback(b=>{
    if(!isAdmin) return;
    setBuildings(prev=>{ const cur=prev.find(x=>x.id===b.id); if(cur) setSelectedBldg(cur); return prev; });
  },[isAdmin]);

  // ── Autocomplete (search bar) ─────────────────────────────────────────────
  const handleSearchInput = v => {
    setSearchQ(v); setShowAc(true);
    clearTimeout(acTimer.current);
    if(v.length>=2){ setAcLoading(true); acTimer.current=setTimeout(async()=>{ setAcResults(await nominatim(v)); setAcLoading(false); },380); }
    else { setAcResults([]); setAcLoading(false); }
  };
  const pickAc = s => {
    setSearchQ(s.display); setShowAc(false); setAcResults([]);
    if(mapRef.current) mapRef.current.flyTo([s.lat,s.lng],17,{duration:1.2});
  };

  return (
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:10}}>

      {/* ── TOP BAR ── */}
      <div className="absolute top-0 left-0 right-0 z-20 px-3 pt-3" style={{pointerEvents:'none'}}>
        <div className="flex items-start gap-2 flex-wrap">

          {/* Brand */}
          <div className="glass rounded-2xl px-4 py-2.5 flex items-center gap-2.5" style={{pointerEvents:'all'}}>
            <div className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:'linear-gradient(135deg,#ef4444,#dc2626)'}}>
              <Icon name="mapPin" size={13} cls="text-white"/>
            </div>
            <div>
              <p className="text-xs font-bold text-white leading-none">RedLine</p>
              <p className="text-[9px] text-slate-500 leading-none mt-0.5">Netanya · Poleg & Ir Yamim</p>
            </div>
          </div>

          {/* Stats */}
          <div className="flex gap-2 flex-wrap" style={{pointerEvents:'all'}}>
            <StatCard label="Total Target" value={fmt(stats.total)} icon="target" color="#fbbf24" sub={`${buildings.length} buildings`}/>
            <StatCard label="Committed" value={fmt(stats.committed)} icon="trending" color="#60a5fa" sub={`${stats.nCommitted} buildings`}/>
            <StatCard label="Collected" value={fmt(stats.paid)} icon="check" color="#34d399" sub={`${stats.nPaid} paid`}/>
          </div>

          {/* Mode & Access Indicator */}
          <div className="glass rounded-2xl p-1 flex items-center gap-1" style={{pointerEvents:'all'}}>
            <button onClick={()=>{setIsAdmin(false);setAddMode(false);showToast('Switched to Public Read-Only Mode','info');}}
              title="Public Read-Only Mode: Hover and explore data without editing"
              className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold t300 ${!isAdmin?'bg-white/15 text-white':'text-slate-400 hover:text-white'}`}
              style={{pointerEvents:'all'}}>
              <Icon name="eye" size={12}/>
              <span className="hidden sm:inline">Public Read-Only</span>
              <span className="sm:hidden">Viewer</span>
            </button>
            <button onClick={()=>{ if(!isAdmin) setShowPwModal(true); }}
              title="Admin Editing Mode: Requires Passcode to edit buildings and record payments"
              className={`flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold t300 ${isAdmin?'text-white':'text-slate-400 hover:text-white'}`}
              style={{background:isAdmin?'linear-gradient(135deg,#3b82f6,#2563eb)':'',pointerEvents:'all'}}>
              <Icon name="shield" size={12}/>
              <span className="hidden sm:inline">Admin Editing</span>
              <span className="sm:hidden">Admin</span>
            </button>
          </div>

          {/* Database & Cloud Connection Status Pill */}
          <button onClick={()=>setShowConfigModal(true)} title="Supabase Database Settings"
            className="glass rounded-2xl px-3 py-2 flex items-center gap-2 t300 hover:bg-white/10" style={{pointerEvents:'all'}}>
            <div className={`w-2 h-2 rounded-full ${dbConnected ? 'bg-emerald-400 live-dot' : isOffline ? 'bg-red-400' : 'bg-amber-400 warn-dot'}`}/>
            <span className="text-[11px] font-medium text-slate-300 hidden md:inline">
              {dbConnected ? (realtimeActive ? 'Cloud Realtime' : 'Cloud DB') : (isOffline ? 'Offline' : 'Local Mock DB')}
            </span>
            <Icon name="settings" size={12} cls="text-slate-400 hover:text-white"/>
          </button>

          {/* Admin toolbar */}
          {isAdmin && (
            <div className="flex gap-2 flex-wrap" style={{pointerEvents:'all'}}>
              {/* Add Building button */}
              <button onClick={()=>{setAddMode(m=>!m); setAddCoords(null);}}
                className={`rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold t300 ${addMode?'text-white shadow-lg':'glass text-emerald-400 hover:text-emerald-300'}`}
                style={{background:addMode?'linear-gradient(135deg,#10b981,#059669)':'',pointerEvents:'all'}}>
                <Icon name="plus" size={12}/>
                {addMode ? '🎯 Click map to place…' : 'Add Building'}
              </button>
              {addMode && (
                <button onClick={()=>{setShowAddModal(true);setAddCoords(null);}}
                  className="glass rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold text-blue-400 hover:text-blue-300 t300"
                  style={{pointerEvents:'all'}}>
                  <Icon name="building2" size={12}/> Enter Manually
                </button>
              )}
              <button onClick={()=>exportCSV(buildings)}
                className="glass rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold text-sky-400 hover:text-sky-300 t300"
                style={{pointerEvents:'all'}}>
                <Icon name="download" size={12}/> Export CSV
              </button>
              <button onClick={async ()=>{
                if(confirm('Reset all data to sample defaults?')){
                  setBuildings(SEED);
                  localStorage.removeItem(STORE_KEY);
                  const client = getSupabaseClient();
                  if (client && dbConnected) {
                    try {
                      const dbSeed = SEED.map(mapBuildingToDb);
                      await client.from('buildings').upsert(dbSeed);
                    } catch(e) { console.warn('Supabase reset seed:', e); }
                  }
                  showToast('Reset to defaults & synced to cloud','info');
                }
              }}
                className="glass rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold text-amber-400 hover:text-amber-300 t300"
                style={{pointerEvents:'all'}}>
                <Icon name="refresh" size={12}/> Reset
              </button>
              <button onClick={async ()=>{
                if(confirm('Are you sure you want to delete ALL buildings? This cannot be undone.')){
                  setBuildings([]);
                  localStorage.setItem(STORE_KEY, JSON.stringify([]));
                  const client = getSupabaseClient();
                  if (client && dbConnected) {
                    try {
                      await client.from('buildings').delete().neq('id', '___');
                    } catch(e) { console.warn('Supabase bulk delete:', e); }
                  }
                  showToast('All buildings deleted', 'info');
                }
              }}
                className="glass rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-semibold text-red-400 hover:text-red-300 t300 hover:bg-red-500/10"
                style={{border: '1px solid rgba(239, 68, 68, 0.3)', pointerEvents:'all'}}>
                <Icon name="trash" size={12}/> Delete All
              </button>
            </div>
          )}
        </div>

        {/* Progress bar */}
        <div className="glass rounded-2xl p-3 mt-2 max-w-xl" style={{pointerEvents:'all'}}>
          <div className="flex justify-between items-center mb-1.5">
            <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Collection Progress</span>
            <span className="text-[10px] font-bold text-white">{fmtPct(stats.pPaid)} collected</span>
          </div>
          <div className="h-2 bg-white/10 rounded-full overflow-hidden relative">
            <div className="absolute top-0 left-0 h-full rounded-full t300" style={{width:`${stats.pComm}%`,background:'rgba(96,165,250,0.45)'}}/>
            <div className="absolute top-0 left-0 h-full rounded-full t300" style={{width:`${stats.pPaid}%`,background:'linear-gradient(90deg,#10b981,#34d399)'}}/>
          </div>
          <div className="flex gap-4 mt-1.5">
            <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-emerald-500"/><span className="text-[9px] text-slate-400">Paid {fmtPct(stats.pPaid)}</span></div>
            <div className="flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-blue-400 opacity-60"/><span className="text-[9px] text-slate-400">+{fmtPct(stats.pComm-stats.pPaid)} committed</span></div>
            {dbLoading && <div className="flex items-center gap-1 ml-auto"><div className="w-2.5 h-2.5 rounded-full border-2 border-slate-600 border-t-emerald-400 spin"/><span className="text-[9px] text-emerald-400">Syncing with Supabase...</span></div>}
            {isOffline && <div className="flex items-center gap-1 ml-auto text-amber-400 text-[9px]"><Icon name="wifiOff" size={10}/> Offline mode (local changes preserved)</div>}
          </div>
        </div>
      </div>

      {/* ── LEFT PANEL ── */}
      <div className="absolute left-3 z-20" style={{top:'270px',pointerEvents:'none',maxWidth:'260px',width:'100%'}}>

        {/* Search */}
        <div className="relative mb-2" ref={searchRef}>
          <div className="glass rounded-2xl p-2" style={{pointerEvents:'all'}}>
            <div className="flex items-center gap-2">
              <Icon name="search" size={14} cls="text-slate-400 ml-1 flex-shrink-0"/>
              <input type="text" placeholder="Search address or street…" value={searchQ}
                onChange={e=>handleSearchInput(e.target.value)}
                onFocus={()=>searchQ.length>=2&&setShowAc(true)}
                onBlur={()=>setTimeout(()=>setShowAc(false),160)}
                style={{background:'transparent',border:'none',boxShadow:'none',padding:'4px 0',fontSize:'12px',pointerEvents:'all'}}/>
              {searchQ && <button onClick={()=>{setSearchQ('');setAcResults([]);setShowAc(false);}} className="text-slate-500 hover:text-white t300" style={{pointerEvents:'all'}}><Icon name="x" size={12}/></button>}
              {acLoading && <div className="w-3 h-3 rounded-full border-2 border-slate-600 border-t-blue-400 flex-shrink-0 spin"/>}
            </div>
          </div>
          {showAc && (acResults.length>0||acLoading) && (
            <div className="autocomplete-dropdown absolute top-full left-0 right-0 mt-1 z-30" style={{pointerEvents:'all'}}>
              {acLoading&&acResults.length===0&&<div className="autocomplete-item ac-loading"><div className="w-3 h-3 rounded-full border-2 border-slate-700 border-t-blue-400 spin flex-shrink-0"/>Searching…</div>}
              {acResults.map((s,i)=>(
                <div key={i} className="autocomplete-item" onMouseDown={()=>pickAc(s)}>
                  <Icon name="mapPin" size={10} cls="text-blue-400 flex-shrink-0"/>
                  <span className="truncate">{s.display}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Filter chips */}
        <div className="flex gap-1.5 mb-2 flex-wrap" style={{pointerEvents:'all'}}>
          {[['','All'],['uncommitted','Uncommitted'],['committed','Committed'],['paid','Paid']].map(([val,lbl])=>(
            <button key={val} onClick={()=>setFilterStatus(val)}
              className={`px-2.5 py-1 rounded-full text-[10px] font-semibold t300 ${filterStatus===val?'text-white shadow-lg':'glass text-slate-400 hover:text-white'}`}
              style={{background:filterStatus===val?(val===''?'linear-gradient(135deg,#6366f1,#4f46e5)':val==='uncommitted'?'#475569':val==='committed'?'#2563eb':'#059669'):'',pointerEvents:'all'}}>
              {lbl}
            </button>
          ))}
        </div>

        {/* List toggle */}
        <button onClick={()=>setShowList(!showList)}
          className="glass w-full rounded-xl py-2 flex items-center justify-center gap-2 text-xs font-semibold text-slate-300 hover:text-white t300 mb-2"
          style={{pointerEvents:'all'}}>
          <Icon name="building2" size={13}/>
          {showList?'Hide':'Show'} Building List
          <Icon name="chevron" size={12} cls={`t300 ${showList?'rotate-180':''}`}/>
        </button>

        {showList && (
          <SidebarList buildings={buildings} filterStatus={filterStatus} searchQ={searchQ}
            isAdmin={isAdmin} onBuildingClick={handleBuildingClick} onClose={()=>setShowList(false)}/>
        )}
      </div>

      {/* ── LEGEND ── */}
      <div className="absolute bottom-8 left-3 z-20 glass rounded-2xl p-3" style={{pointerEvents:'all'}}>
        <p className="text-[9px] font-semibold text-slate-500 uppercase tracking-wider mb-2">Legend</p>
        {Object.entries(STATUS).map(([key,s])=>(
          <div key={key} className="flex items-center gap-2 mb-1.5 last:mb-0">
            <div className="w-3 h-3 rounded-sm border-2" style={{background:s.fill,borderColor:s.color,opacity:key==='uncommitted'?.5:1}}/>
            <span className="text-[10px] text-slate-300">{s.label}</span>
            <span className="text-[9px] text-slate-600 ml-auto">{buildings.filter(b=>b.status===key).length}</span>
          </div>
        ))}
      </div>

      {/* ── ADMIN BADGE ── */}
      {isAdmin && (
        <div className="absolute bottom-8 right-16 z-20" style={{pointerEvents:'none'}}>
          <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold text-white"
               style={{background:'linear-gradient(135deg,#3b82f6,#2563eb)',boxShadow:'0 4px 16px rgba(59,130,246,0.4)'}}>
            <Icon name="shield" size={11}/> ADMIN MODE
          </div>
        </div>
      )}

      {/* ── ADD MODE banner ── */}
      {addMode && (
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 z-30 pointer-events-none"
             style={{transform:'translate(-50%,-50%)',top:'auto',bottom:'120px'}}>
          <div className="flex items-center gap-2 px-5 py-3 rounded-2xl text-sm font-semibold text-white fade-in-up"
               style={{background:'linear-gradient(135deg,rgba(16,185,129,0.9),rgba(5,150,105,0.9))',backdropFilter:'blur(12px)',border:'1px solid rgba(52,211,153,0.4)',boxShadow:'0 8px 32px rgba(0,0,0,0.4)'}}>
            <Icon name="mapPin" size={16}/>
            Click anywhere on the map or on a building to place/edit
          </div>
        </div>
      )}

      {/* ── TOAST ── */}
      {toast && (
        <div className="absolute bottom-6 left-1/2 z-50 rounded-xl px-4 py-2.5 flex items-center gap-2 text-sm font-medium text-white shadow-2xl fade-in-up"
          style={{transform:'translateX(-50%)',
            background:toast.type==='success'?'linear-gradient(135deg,rgba(16,185,129,0.92),rgba(5,150,105,0.92))':'linear-gradient(135deg,rgba(59,130,246,0.92),rgba(37,99,235,0.92))',
            backdropFilter:'blur(12px)',border:'1px solid rgba(255,255,255,0.15)',pointerEvents:'none'}}>
          <Icon name={toast.type==='success'?'check':'info'} size={14}/>
          {toast.msg}
        </div>
      )}

      {/* ── MODALS ── */}
      {/* ── INITIAL DB LOADING SPINNER OVERLAY ── */}
      {dbLoading && buildings.length === 0 && (
        <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop" style={{pointerEvents:'all'}}>
          <div className="glass rounded-2xl p-6 flex flex-col items-center gap-3 border border-white/15 shadow-2xl">
            <div className="w-8 h-8 rounded-full border-3 border-emerald-500 border-t-transparent spin" style={{borderWidth:'3px'}}/>
            <p className="text-sm font-semibold text-white">Connecting to Central Database...</p>
            <p className="text-xs text-slate-400">Synchronizing Netanya community payments in real-time</p>
          </div>
        </div>
      )}

      {showConfigModal && (
        <ConfigModal
          onClose={()=>setShowConfigModal(false)}
          onSaved={(cfg)=>{
            showToast('Supabase settings updated', 'success');
            // Re-initialize client
            supabaseClient = null;
            getSupabaseClient();
          }}
        />
      )}

      {showPwModal && (
        <AdminPasswordModal
          onSuccess={()=>{ setIsAdmin(true); setShowPwModal(false); showToast('Admin mode unlocked','info'); }}
          onCancel={()=>setShowPwModal(false)}/>
      )}

      {isAdmin && selectedBldg && (
        <BuildingModal
          building={selectedBldg}
          onClose={()=>setSelectedBldg(null)}
          onSave={handleSave}
          onDelete={handleDelete}/>
      )}

      {showAddModal && (
        <AddBuildingModal
          initialLat={addCoords?.lat}
          initialLng={addCoords?.lng}
          initialAddress={addCoords?.address}
          initialStreet={addCoords?.street}
          initialPolygon={addCoords?.polygon}
          onClose={()=>{ setShowAddModal(false); setAddCoords(null); }}
          onAdd={handleAdd}/>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
