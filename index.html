function mapDbToBuilding(row) {
  return {
    id: row.id,
    address: row.address,
    street: row.street || row.address,
    neighborhood: row.neighborhood || 'Ir Yamim',
    units: row.units || 40,
    manager: row.manager || '',
    status: row.status || 'uncommitted',
    target: Number(row.target_ils !== undefined ? row.target_ils : (row.target || 5000)),
    paid: Number(row.paid_ils !== undefined ? row.paid_ils : (row.paid || 0)),
    lat: Number(row.lat),
    lng: Number(row.lng),
    polygon: row.polygon || null,
    notes: row.notes || '',
    updated_at: row.updated_at || new Date().toISOString()
  };
}

}

const AdminPasswordModal = ({onSuccess, onCancel}) => {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState(false);
  const ref = useRef();
  useEffect(()=>{ ref.current?.focus(); },[]);

  const submit = e => {
    e.preventDefault();
    if(pw === getEnvConfig().adminPasscode) { onSuccess(); }
    else { setErr(true); setPw(''); }
  };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop" style={{pointerEvents:'all'}}>
      <div className="glass modal-panel w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden fade-in-up" style={{border:'1px solid rgba(255,255,255,0.15)'}}>
        <div className="p-5 border-b border-white/10 flex items-center justify-between">
          <p className="text-sm font-bold text-white">Admin Access Required</p>
          <button onClick={onCancel} className="text-slate-400 hover:text-white"><Icon name="x" size={16}/></button>
        </div>
        <form onSubmit={submit} className="p-5 space-y-4">
          <input ref={ref} type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Enter admin password..."/>
          {err && <p className="text-[11px] text-red-400">Incorrect password.</p>}
          <div className="flex gap-3">
            <button type="button" onClick={onCancel} className="flex-1 py-2 text-sm text-slate-300 border border-white/10 rounded-xl">Cancel</button>
            <button type="submit" className="flex-1 py-2 text-sm text-white bg-blue-600 rounded-xl">Unlock</button>
          </div>
        </form>
      </div>
    </div>
  );
};

    onSave({...building, status, paid: status==='paid' ? Number(paid) : 0, notes});

  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop" style={{pointerEvents:'all'}}>

            <option value="committed">Committed</option>

        )}
        <div>
          <label className="text-xs text-slate-400 block mb-1">Notes</label>
          <textarea rows={2} value={notes} onChange={e=>setNotes(e.target.value)}/>
        </div>
        <div className="flex gap-2">
          <button onClick={()=>{onDelete(building.id); onClose();}} className="px-3 py-2 text-xs text-red-400 border border-red-500/30 rounded-xl">Delete</button>
          <div className="flex-1"/>
          <button onClick={onClose} className="px-3 py-2 text-xs text-slate-300 border border-white/10 rounded-xl">Cancel</button>
          <button onClick={save} className="px-4 py-2 text-xs text-white bg-blue-600 rounded-xl">Save</button>
        </div>
      </div>
    </div>
  );
};

function App() {
  const [buildings,   setBuildings]   = useState(loadBuildings);
  const [isAdmin,     setIsAdmin]     = useState(false);
  const [showPwModal, setShowPwModal] = useState(false);
  const [selectedBldg,setSelectedBldg]= useState(null);
  const [dbConnected, setDbConnected] = useState(false);
  const [toast,       setToast]       = useState(null);

  const mapRef     = useRef(null);
  const markersRef = useRef({});

  const showToast = useCallback((msg)=>{
    setToast(msg);
    setTimeout(()=>setToast(null), 3200);
  },[]);

  const stats = useMemo(()=>{
    const total     = buildings.reduce((s,b)=>s+b.target,0);
    const committed = buildings.filter(b=>b.status==='committed').reduce((s,b)=>s+b.target,0);
    const paid      = buildings.filter(b=>b.status==='paid').reduce((s,b)=>s+b.paid,0);
    return { total, committed, paid, pPaid: total>0?(paid/total)*100:0, pComm: total>0?((paid+committed)/total)*100:0 };
  },[buildings]);

  useEffect(() => {
    const client = getSupabaseClient();
    if (!client) return;

    let channel = null;
    async function initSupabase() {
      try {
        const { data, error } = await client.from('buildings').select('*');
        if (error) throw error;
        if (data && data.length > 0) {
          const mapped = data.map(mapDbToBuilding);
          setBuildings(mapped);
          saveBuildings(mapped);
          setDbConnected(true);
        }
      } catch (err) {
        console.warn('Supabase sync error:', err);
      }

      channel = client
        .channel('public:buildings')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'buildings' }, payload => {
          if (payload.eventType === 'INSERT') {
            setBuildings(prev => [...prev, mapDbToBuilding(payload.new)]);
          } else if (payload.eventType === 'UPDATE') {
            const updated = mapDbToBuilding(payload.new);
            setBuildings(prev => prev.map(b => b.id === updated.id ? updated : b));
          } else if (payload.eventType === 'DELETE') {
            setBuildings(prev => prev.filter(b => b.id !== payload.old.id));
          }
        })
        .subscribe(status => { if (status === 'SUBSCRIBED') setDbConnected(true); });
    }
    initSupabase();
    return () => { if (channel && client) client.removeChannel(channel); };
  }, []);

  useEffect(()=>{
    const map = L.map('map',{center:CENTER, zoom:ZOOM, zoomControl:false}).setView(CENTER, ZOOM);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(map);
    mapRef.current = map;
    return ()=>map.remove();
  },[]);

  useEffect(()=>{
    const map = mapRef.current;
    if(!map) return;
    Object.values(markersRef.current).forEach(m=>map.removeLayer(m));
    markersRef.current = {};

    buildings.forEach(b=>{
      const s = STATUS[b.status];
      const r = 16;
      const sz = r*2;
      const svg = `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg">
        <circle cx="${r}" cy="${r}" r="${r-2}" fill="${s.fill}" fill-opacity="0.6" stroke="${s.color}" stroke-width="2"/>
      </svg>`;

      const icon = L.divIcon({html:svg, className:'', iconSize:[sz,sz], iconAnchor:[r,r]});
      const m = L.marker([b.lat,b.lng],{icon,interactive:true});

      m.bindTooltip(`<b>${b.address}</b><br/>Status: ${s.label}<br/>Paid: ${fmt(b.paid)}`, {direction:'top'});
      m.on('click',()=>{
        setSelectedBldg(b);
      });
      m.addTo(map);
      markersRef.current[b.id]=m;
    });
  },[buildings]);

  const handleSave = async (updated) => {
    setBuildings(prev=>prev.map(b=>b.id===updated.id?updated:b));
    showToast('Saved locally');
    const client = getSupabaseClient();
    if(client && dbConnected){
      try { await client.from('buildings').upsert(mapBuildingToDb(updated)); } catch(e){}
    }
  };

  const handleDelete = async (id) => {
    setBuildings(prev=>prev.filter(b=>b.id!==id));
    showToast('Deleted');
    const client = getSupabaseClient();
    if(client && dbConnected){
      try { await client.from('buildings').delete().eq('id', id); } catch(e){}
    }
  };

  return (
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:10}}>
      <div className="absolute top-3 left-3 z-20 flex gap-2 flex-wrap" style={{pointerEvents:'all'}}>
        <div className="glass rounded-2xl px-4 py-2.5">
          <p className="text-xs font-bold text-white">RedLine GIS Netanya</p>
          <p className="text-[9px] text-emerald-400">{dbConnected ? '● Live Supabase Synced' : '○ Standalone Mode'}</p>
        </div>
        <StatCard label="Total Target" value={fmt(stats.total)} icon="target" color="#fbbf24"/>
        <StatCard label="Collected" value={fmt(stats.paid)} icon="check" color="#34d399"/>
        <button onClick={() => isAdmin ? setIsAdmin(false) : setShowPwModal(true)}
          className="glass rounded-xl px-3 py-2 text-xs font-semibold text-white">
          {isAdmin ? 'Exit Admin Mode' : 'Admin Login'}
        </button>
      </div>

      {showPwModal && <AdminPasswordModal onSuccess={()=>{setIsAdmin(true); setShowPwModal(false); showToast('Admin Unlocked');}} onCancel={()=>setShowPwModal(false)}/>}
      {selectedBldg && <BuildingModal building={selectedBldg} onClose={()=>setSelectedBldg(null)} onSave={handleSave} onDelete={handleDelete}/>}
      {toast && <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
