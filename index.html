function formatHebrewAddress(rawAddress) {
  if (!rawAddress) return '';
  const parts = rawAddress.split(',').map(s => s.trim());
  const cleanParts = parts.filter(p => p !== 'נתניה' && p !== 'עיר ימים' && p !== 'פולג' && p !== 'התקווה');
  if (cleanParts.length >= 2) {
    const maybeNum = cleanParts[0];
    const maybeStreet = cleanParts[1];
    if (/^\d+$/.test(maybeNum)) {
      return `${maybeStreet} ${maybeNum}`;
    }
  }
  return cleanParts.join(' ') || rawAddress;
}

function mapDbToBuilding(row) {
  const rawAddr = row.address || '';
  const formattedAddr = formatHebrewAddress(rawAddr);
  return {
    id: row.id,
    address: formattedAddr,
    street: row.street || formattedAddr,
    neighborhood: row.neighborhood || 'Ir Yamim',
    units: row.units || 40,
    manager: row.manager || '',
    status: row.status || 'committed',
    target: Number(row.target_ils !== undefined ? row.target_ils : (row.target || 1000)),
    paid: Number(row.paid_ils !== undefined ? row.paid_ils : (row.paid || 0)),
    lat: Number(row.lat),
    lng: Number(row.lng),
    polygon: row.polygon || null,
    notes: row.notes || '',
    updated_at: row.updated_at || new Date().toISOString()
  };
}

async function reverseLookup(lat, lng) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&polygon_geojson=1&accept-language=he,en`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'he,en' } });
    const data = await res.json();
    const parts = (data.display_name || '').split(',').map(s => s.trim());
    const rawAddr = parts.slice(0, 3).join(', ') || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    const address = formatHebrewAddress(rawAddr);
    const street = (data.address && (data.address.road || data.address.pedestrian || data.address.suburb)) || parts[0] || '';
    let polygon = null;
    if (data.geojson && (data.geojson.type === 'Polygon' || data.geojson.type === 'MultiPolygon')) {
      polygon = data.geojson.coordinates;
    }
    return { address, street, polygon };
  } catch (e) {
    return { address: `${lat.toFixed(5)}, ${lng.toFixed(5)}`, street: '', polygon: null };
  }
}

async function nominatim(query) {
  if (!query || query.length < 2) return [];
  try {
    const cleanQ = query.replace(/["']/g, ' ').replace(/\s+/g, ' ').trim();
    let url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cleanQ+' נתניה')}&format=json&limit=5&polygon_geojson=1&countrycodes=il&bounded=1&viewbox=34.82,32.31,34.88,32.25&accept-language=he,en`;
    let res = await fetch(url,{headers:{'Accept-Language':'he,en'}});
    let data = await res.json();
    
    if (!data || data.length === 0) {
      url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cleanQ+' נתניה')}&format=json&limit=5&polygon_geojson=1&countrycodes=il&accept-language=he,en`;
      res = await fetch(url,{headers:{'Accept-Language':'he,en'}});
      data = await res.json();
    }

    if ((!data || data.length === 0) && /\d+/.test(cleanQ)) {
      const streetOnly = cleanQ.replace(/\d+/g, '').replace(/[\,\-\.\u05f3\u05f4]/g, ' ').trim();
      url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(streetOnly+' נתניה')}&format=json&limit=5&polygon_geojson=1&countrycodes=il&accept-language=he,en`;
      res = await fetch(url,{headers:{'Accept-Language':'he,en'}});
      data = await res.json();
    }

    return data.map(x=>({
      display: formatHebrewAddress(x.display_name.split(',').slice(0,3).join(', ')),
      lat: +x.lat,
      lng: +x.lon,
      polygon: (x.geojson && (x.geojson.type === 'Polygon' || x.geojson.type === 'MultiPolygon')) ? x.geojson.coordinates : null
    }));
  } catch { return []; }
}

async function fetchOSMBuildings() {
  try {
    const query = `[out:json][timeout:25];(way["building"](${OVERPASS_BBOX});relation["building"](${OVERPASS_BBOX}););out body;>;out skel qt;`;
    const res = await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST', body:'data='+encodeURIComponent(query),
      headers:{'Content-Type':'application/x-www-form-urlencoded'}
    });
    const json = await res.json();
    const nodes = {};
    json.elements.forEach(e => { if(e.type==='node') nodes[e.id]={lat:e.lat,lng:e.lon}; });
    const features = [];
    json.elements.forEach(e => {
      if(e.type==='way' && e.nodes) {
        const coords = e.nodes.map(nid => nodes[nid]).filter(Boolean);
        if(coords.length < 3) return;
        if(coords[0].lat !== coords[coords.length-1].lat) coords.push(coords[0]);
        const ring = coords.map(c=>[c.lng,c.lat]);
        const cLat = coords.reduce((s,c)=>s+c.lat,0)/coords.length;
        const cLng = coords.reduce((s,c)=>s+c.lng,0)/coords.length;
        features.push({
          type:'Feature',
          properties:{ osmId: e.id, centLat: cLat, centLng: cLng },
          geometry:{ type:'Polygon', coordinates:[ring] }
        });
      }
    });
    return features;
  } catch(e) {
    return [];
  }
}

const ConfigModal = ({ onClose, onSaved }) => {
  const current = getEnvConfig();
  const [url, setUrl] = useState(current.url || '');
  const [anonKey, setAnonKey] = useState(current.anonKey || '');
  const [adminPasscode, setAdminPasscode] = useState(current.adminPasscode || 'KavAdom1');
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);

  const testConnection = async () => {
    if (!url || !anonKey) {
      setTestResult({ ok: false, msg: 'נא לספק כתובת URL ומפתח ציבורי' });
      return;
    }
    setTesting(true);
    setTestResult(null);
    try {
      if (!window.supabase) throw new Error('ספריית Supabase לא נטענה');
      const client = window.supabase.createClient(url.trim(), anonKey.trim());
      const { data, error } = await client.from('buildings').select('id').limit(1);
      if (error) throw error;
      setTestResult({ ok: true, msg: 'החיבור לבסיס הנתונים הצליח!' });
    } catch(err) {
      setTestResult({ ok: false, msg: err.message || 'החיבור נכשל' });
    } finally {
      setTesting(false);
    }
  };

  const handleSave = () => {
    const config = {
      url: url.trim(),
      anonKey: anonKey.trim(),
      adminPasscode: adminPasscode.trim() || 'KavAdom1'
    };
    try {
      localStorage.setItem(SUPABASE_KEY, JSON.stringify(config));
    } catch(e) {}
    supabaseClient = null;
    onSaved(config);
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
         onClick={e => e.target === e.currentTarget && onClose()} style={{pointerEvents:'all'}}>
      <div className="glass modal-panel w-full max-w-md rounded-2xl shadow-2xl overflow-hidden fade-in-up"
           style={{border:'1px solid rgba(255,255,255,0.18)'}}>
        <div className="p-5 border-b border-white/10 flex items-center justify-between">
          <div className="flex items-center gap-2.5">

              <Icon name="database" size={15} cls="text-white"/>
            </div>
            <div>
              <p className="text-sm font-bold text-white">בסיס נתונים בענן (Supabase)</p>
              <p className="text-[10px] text-slate-400">הגדרות סנכרון (מנהלים בלבד)</p>
            </div>
          </div>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white t300" style={{pointerEvents:'all'}}>
            <Icon name="x" size={16}/>
          </button>
        </div>

        <div className="p-5 space-y-3.5 max-h-[75vh] overflow-y-auto">
          <div>
            <label className="text-[10px] font-semibold text-slate-400 mb-1 block uppercase tracking-wider">
              כתובת פרויקט URL
            </label>
            <input type="text" value={url} onChange={e=>setUrl(e.target.value)}
              placeholder="https://your-project-id.supabase.co" style={{pointerEvents:'all'}}/>
          </div>

          <div>
            <label className="text-[10px] font-semibold text-slate-400 mb-1 block uppercase tracking-wider">
              מפתח ציבורי Anon Key
            </label>
            <input type="text" value={anonKey} onChange={e=>setAnonKey(e.target.value)}
              placeholder="eyJhbGciOiJIUzI1Ni..." style={{pointerEvents:'all'}}/>
          </div>

            </label>

          {testResult && (
            <div className={`p-3 rounded-xl text-xs flex items-center gap-2 ${testResult.ok ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-red-500/15 text-red-300 border border-red-500/30'}`}>
              <Icon name={testResult.ok ? 'check' : 'x'} size={14}/>

          )}

          <div className="pt-1 flex gap-2">
            <button type="button" onClick={testConnection} disabled={testing || !url || !anonKey}
              className="flex-1 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-white/10 border border-white/10 t300 disabled:opacity-40 flex items-center justify-center gap-1.5"

const AddBuildingModal = ({initialLat, initialLng, initialAddress, initialStreet, initialPolygon, onClose, onAdd}) => {
  const [address,      setAddress]      = useState(initialAddress || '');
  const [street,       setStreet]       = useState(initialStreet || '');
  const [buildingPoly, setBuildingPoly] = useState(initialPolygon || null);
  const [units,        setUnits]        = useState(40);
  const [manager,      setManager]      = useState('');
  const [target,       setTarget]       = useState(1000);
  const [status,       setStatus]       = useState('committed');
  const [lat,          setLat]          = useState(initialLat ? initialLat.toFixed(6) : '');
  const [lng,          setLng]          = useState(initialLng ? initialLng.toFixed(6) : '');
  const [acQuery,      setAcQuery]      = useState(initialAddress || '');
  const [acResults,    setAcResults]    = useState([]);
  const [acLoading,    setAcLoading]    = useState(false);
  const [showAc,       setShowAc]       = useState(false);
  const acTimer = useRef(null);

  const handleAcInput = v => {
    setAcQuery(v); setAddress(v); setShowAc(true);
    clearTimeout(acTimer.current);
    if(v.length>=2){ setAcLoading(true); acTimer.current=setTimeout(async()=>{ setAcResults(await nominatim(v)); setAcLoading(false); },380); }
    else { setAcResults([]); setAcLoading(false); }
  };

  const pickAc = async s => {
    const formatted = formatHebrewAddress(s.display);
    setAddress(formatted); setAcQuery(formatted);
    setLat(s.lat.toFixed(6)); setLng(s.lng.toFixed(6));
    setShowAc(false); setAcResults([]);
    
    if (s.polygon) setBuildingPoly(s.polygon);
    const info = await reverseLookup(s.lat, s.lng);
    if (info.street) setStreet(info.street);
    if (!s.polygon && info.polygon) setBuildingPoly(info.polygon);
  };

  const valid = address.trim() && lat && lng && manager.trim();

  const save = () => {
    if(!valid) return;
    onAdd({
      id: uid(), address: formatHebrewAddress(address.trim()), street: street.trim() || address.trim(),
      neighborhood: 'Ir Yamim', units: Number(units), manager: manager.trim(),
      target: Number(target), lat: parseFloat(lat), lng: parseFloat(lng),
      polygon: buildingPoly,
      status: status, paid: status==='paid'? Number(target) : 0, notes: '',
    });
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center modal-backdrop"
         onClick={e=>e.target===e.currentTarget&&onClose()} style={{pointerEvents:'all'}}>

           style={{border:'1px solid rgba(255,255,255,0.14)'}}>

          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:'linear-gradient(135deg,#10b981,#059669)'}}>
              <Icon name="plus" size={15} cls="text-white"/>
            </div>
            <div>
              <p className="text-sm font-bold text-white">הוספת בניין חדש</p>
              <p className="text-[10px] text-slate-500">
                {lat && lng ? `מיקום מוגדר: ${parseFloat(lat).toFixed(4)}, ${parseFloat(lng).toFixed(4)}` : 'חפש כתובת או הזן פרטים ידנית'}
              </p>
            </div>
          </div>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white t300" style={{pointerEvents:'all'}}>
            <Icon name="x" size={17}/>

        <div className="p-5 space-y-3 max-h-[70vh] overflow-y-auto">

            <p className="text-[10px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">חיפוש כתובת / הזנה ידנית *</p>
            <input type="text" value={acQuery} onChange={e=>handleAcInput(e.target.value)}

              placeholder="לדוגמה: נתן יונתן 22, נתניה" style={{pointerEvents:'all'}}/>
            {showAc && (acResults.length>0 || acLoading) && (
              <div className="autocomplete-dropdown absolute left-0 right-0 top-full mt-1 z-10" style={{pointerEvents:'all'}}>
                {acLoading && acResults.length===0 && <div className="autocomplete-item ac-loading">

  useEffect(() => {
    const client = getSupabaseClient();
    if (!client) {
      setDbConnected(false);
      setRealtimeActive(false);
      return;
    }

    let channel = null;
    let isMounted = true;

    async function initSupabase() {
      setDbLoading(true);
      try {
        const { data, error } = await client.from('buildings').select('*').order('id', { ascending: true });
        if (error) throw error;
        if (isMounted) {
          if (data && data.length > 0) {
            const mapped = data.map(mapDbToBuilding);
            setBuildings(mapped);
            saveBuildings(mapped);
          }
          setDbConnected(true);
        }
      } catch (err) {
        if (isMounted) setDbConnected(false);
      } finally {
        if (isMounted) setDbLoading(false);
      }

      try {
        channel = client
          .channel('public:buildings')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'buildings' }, payload => {
            if (!isMounted) return;
            const eventType = payload.eventType;
            if (eventType === 'INSERT') {
              const newBuilding = mapDbToBuilding(payload.new);
              setBuildings(prev => {
                if (prev.some(b => b.id === newBuilding.id)) return prev;
                return [...prev, newBuilding];
              });
            } else if (eventType === 'UPDATE') {
              const updated = mapDbToBuilding(payload.new);
              setBuildings(prev => prev.map(b => b.id === updated.id ? updated : b));
              setSelectedBldg(prev => (prev && prev.id === updated.id ? updated : prev));
            } else if (eventType === 'DELETE') {
              const delId = payload.old.id;
              setBuildings(prev => prev.filter(b => b.id !== delId));
              setSelectedBldg(prev => (prev && prev.id === delId ? null : prev));
            }
          })
          .subscribe(status => {
            if (isMounted) {
              setRealtimeActive(status === 'SUBSCRIBED');
              if (status === 'SUBSCRIBED') setDbConnected(true);
            }
          });
      } catch (err) {}
    }

    initSupabase();

    return () => {
      isMounted = false;
      if (channel && client) client.removeChannel(channel);
    };
  }, []);
