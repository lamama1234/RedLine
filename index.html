<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; }
    #map { position: fixed; inset: 0; z-index: 0; }

    .leaflet-popup-content-wrapper {
      background: rgba(15,23,42,0.96); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; backdrop-filter: blur(16px); color: #f1f5f9;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: rgba(15,23,42,0.96); }
    .leaflet-popup-content { margin: 0; padding: 0; }
    .leaflet-container { background: #0f172a; }

    .glass {
      background: rgba(15,23,42,0.85);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.10);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }

    .t300 { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }

    .modal-backdrop { background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); }

    .custom-tooltip {
      background: rgba(10,15,28,0.97) !important;
      border: 1px solid rgba(255,255,255,0.14) !important;
      border-radius: 10px !important; color: #f1f5f9 !important;
      font-family: 'Inter', sans-serif !important; font-size: 12px !important;
      padding: 8px 12px !important; white-space: nowrap;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8) !important;
    }
    .leaflet-tooltip-top.custom-tooltip::before { border-top-color: rgba(10,15,28,0.97) !important; }

    .badge-uncommitted { background: rgba(100,116,139,0.25); color: #94a3b8; border: 1px solid rgba(100,116,139,0.4); }
    .badge-committed   { background: rgba(59,130,246,0.25); color: #93c5fd; border: 1px solid rgba(59,130,246,0.45); }
    .badge-paid        { background: rgba(16,185,129,0.25); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.45); }

    input[type="text"], input[type="number"], input[type="password"], select, textarea {
      background: rgba(255,255,255,0.06) !important;
      border: 1px solid rgba(255,255,255,0.13) !important;
      color: #f1f5f9 !important; border-radius: 8px !important;
      padding: 8px 12px !important; outline: none !important;
      transition: border-color 0.2s; width: 100%;
    }
    input[type="text"]:focus, input[type="number"]:focus,
    input[type="password"]:focus, select:focus, textarea:focus {
      border-color: rgba(59,130,246,0.65) !important;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15) !important;
    }
    input::placeholder { color: rgba(148,163,184,0.45) !important; }
    select option { background: #1e293b; color: #f1f5f9; }
    input[type="radio"] { accent-color: #3b82f6; }

    @media (max-width: 640px) {
      .modal-panel { width: 100vw !important; max-width: 100vw !important;
        border-radius: 20px 20px 0 0 !important; max-height: 92vh; overflow-y: auto; }
    }
